group: asset
name: logcluster
description: 仓库日志模式识别配置
path: repo_logcluster_target
methods:
  get-setting:
    description: 获取日志模式识别配置
    http:
      method: GET
  update:
    description: 更新日志模式识别配置
    http:
      method: PUT
    params:
      body:
        - name: status
          type: string
          description: 日志聚类目标状态 (enabled/disabled)
        - name: effect_type
          field: effectType
          type: string
          description: 生效类型 (repo/sourcetype)
        - name: effect_ids
          field: effectIds
          type: string
          required: true
          multiple: true
          description: 生效对象ID (可多次传递，如 --effect-ids a --effect-ids b)
    request_body:
      status: '{{ status | default("enabled") }}'
      effectType: '{{ effect_type | default("repo") }}'
      effectIds: '{{ effect_ids | tojson }}'
  list:
    description: 模式识别规则列表
    http:
      method: GET
    params:
      query:
        - name: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          type: int
          default: 10
          description: 每页条数
        - name: sort
          type: string
          default: updateTime
          description: 排序字段
        - name: order
          type: string
          default: desc
          description: 排序方向
    output:
      items_path: $.items
      fields:
        - name: name
          alias: 名称
        - name: description
          alias: 描述
        - name: sourceType
          alias: 来源类型
        - name: patternType
          alias: 模式类型
        - name: status
          alias: 状态
        - name: updateTime
          alias: 更新时间
          format: datetime
  create:
    description: 创建模式识别规则
    http:
      method: POST
    params:
      body:
        - name: name
          type: string
          required: true
          description: 规则名称
        - name: source_type
          field: sourceType
          type: string
          multiple: true
          description: 来源类型 (可多次传递)
        - name: pattern_type
          field: patternType
          type: string
          default: regex
          description: 模式类型
        - name: recognition_field
          field: recognitionField
          type: string
          description: 识别字段
        - name: description
          type: string
          description: 规则描述
        - name: config
          type: file
          description: 配置文件路径 (JSON，可用 --config /path/to/config.json 指定)
    request_body:
      name: '{{ name }}'
      sourceType: '{{ source_type | tojson }}'
      patternType: '{{ pattern_type | default("regex") }}'
      recognitionField: '{{ recognition_field | default("") }}'
      description: '{{ description | default("") }}'
      filters: []
      patterns: []
      config: '{{ config | default("") }}'
  delete:
    description: 删除模式识别规则
    http:
      method: POST
      path: pattern_rule:batchDelete
    params:
      body:
        - name: id
          type: string
          required: true
          multiple: true
          description: 规则 ID (可多次传递)
    request_body:
      ids: '{{ id | tojson }}'
  update:
    description: 更新模式识别规则
    http:
      method: PUT
      path: pattern_rule/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 规则 ID
      body:
        - name: name
          type: string
          description: 规则名称
        - name: source_type
          field: sourceType
          type: string
          multiple: true
          description: 来源类型 (可多次传递)
        - name: pattern_type
          field: patternType
          type: string
          description: 模式类型
        - name: description
          type: string
          description: 规则描述
        - name: config
          type: file
          description: 配置文件路径 (JSON)
    request_body:
      name: '{{ name | default("") }}'
      description: '{{ description | default("") }}'
      sourceType: '{{ source_type | tojson }}'
      patternType: '{{ pattern_type | default("regex") }}'
      filters: []
      patterns: []
      config: '{{ config | default("") }}'
