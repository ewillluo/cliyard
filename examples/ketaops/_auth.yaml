# =============================================================================
# ketaops — KetaDB API 服务配置
#
# 使用方式：
#   1. 生成 CLI:  cliyard gen --name ketaops-cli --defs-path ./
#   2. 安装:      cd ketaops-cli && pip install -e .
#   3. 认证:      ketaops-cli auth add -n prod -e https://your-server.com -u admin -p password
#   4. 使用:      ketaops-cli repos list --page-size 10
#
# 多环境:
#   ketaops-cli auth add -n dev -e https://dev.example.com -u admin -p pass
#   ketaops-cli auth add -n prod -e https://prod.example.com -t <token> --default
#   ketaops-cli --env prod repos list
#
# 认证方式:
#   - 用户名密码: auth add -u <user> -p <pass>
#   - 直接 token: auth add -t <token>
#   - 自定义 env: auth add --set API_KEY=abc --set SECRET=xyz
# =============================================================================

name: ketaops
version: "1.0"
description: KetaDB Operations API - 管理仓库、用户、告警、仪表盘等资源
server:
  # 服务端地址由 auth add 命令动态传入
  # 例如多 server:  auth add -n prod --serve4go https://go-api.com --serve4java https://java-api.com
  # 单 server:     auth add -n prod -e https://api.com
  # 列表中的 name 会动态生成为 auth add 的 CLI 选项
  - name: serve4go
    prefix: /api/v1
  - name: serve4java
    prefix: /api/v2

# ── 认证配置 ──────────────────────────────────────────────────────────────
auth:
  id: ketaops

  # 环境变量映射: auth add -u/-p 设置哪个环境变量
  params:
    username: KETA_USER      # -u admin → export KETA_USER=admin
    password: KETA_PASS      # -p secret → export KETA_PASS=secret

  # 认证步骤链
  steps:
    # 使用插件认证（plugins/keta_auth.py）
    # 两步: login → create_token
    - name: keta_login
      type: plugin:keta_login
      server: serve1
      config:
        login_endpoint: /api/v1/account/login
        token_endpoint: /api/v1/auth/tokens

  # 凭证持久化: auth add 成功后保存到 ~/.cliyard/credentials.yaml
  persist:
    to: cliyard-config
    fields:
      token:
        from: keta_login

