group: alert
name: notices-binding
description: 告警通知绑定
path: alerts
methods:
  get:
    description: 告警通知绑定 - get
    http:
      method: GET
      path: alerts/{{ asset_id }}/notices
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  update:
    description: 告警通知绑定 - update
    http:
      method: PUT
      path: alerts/notices
    params:
      body:
      - name: alertIds
        type: string
        description: '告警规则ID列表 (default: [])'
      - name: addNoticeIds
        type: string
        description: '添加的通知ID列表 (default: [])'
      - name: deleteNoticeIds
        type: string
        description: '删除的通知ID列表 (default: [])'
      - name: addNoticeUpgradeIds
        type: string
        description: '添加的升级通知ID列表 (default: [])'
      - name: deleteNoticeUpgradeIds
        type: string
        description: '删除的升级通知ID列表 (default: [])'
