group: dc
name: transformer
description: KetaAgent 解析模板
path: dc/transformer/types
methods:
  list:
    description: 解析模板列表
    http:
      method: GET
    output:
      items_path: $.types
      fields:
        - name: name
          alias: 名称
        - name: description
          alias: 描述
        - name: app
          alias: 所属应用
        - name: updateTime
          alias: 更新时间
          format: datetime
