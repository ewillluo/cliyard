name: dc-token
description: KetaAgent 采集 Token
path: dc/token
methods:
  list:
    description: 采集 Token 列表
    http:
      method: GET
    params:
      query:
        - name: sort
          type: string
          default: createTime
          description: 排序字段
    output:
      items_path: $.tokens
      fields:
        - name: id
          alias: ID
        - name: name
          alias: 名称
        - name: description
          alias: 描述
        - name: enabled
          alias: 是否启用
        - name: createTime
          alias: 创建时间
          format: datetime
        - name: expireTime
          alias: 过期时间
          format: datetime
        - name: lastAccessTime
          alias: 最后访问
          format: datetime
        - name: lastAccessIP
          alias: 访问IP
  create:
    description: 创建采集 Token
    http:
      method: POST
    params:
      body:
        - name: name
          type: string
          description: 采集令牌名称
        - name: description
          type: string
          description: 采集令牌描述
        - name: expire_time
          field: expireTime
          type: int
          description: 过期时间(毫秒时间戳)
        - name: not_before
          field: notBefore
          type: int
          description: 生效时间(毫秒时间戳)
  delete:
    description: 删除采集 Token
    http:
      method: DELETE
      path: dc/token/{{ token_id }}
    params:
      path:
        - name: token_id
          type: string
          required: true
          description: Token ID
