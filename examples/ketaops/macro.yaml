group: asset
name: macro
description: 搜索宏管理
path: spl/macro
methods:
  list:
    description: 搜索宏列表
    http:
      method: GET
      path: spl/macro/list
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.macros
      fields:
        - name: id
          alias: ID
        - name: name
          alias: 名称
        - name: description
          alias: 描述
        - name: definition
          alias: SPL定义
        - name: arguments
          alias: 参数
        - name: app
          alias: 应用
        - name: dynamic
          alias: 动态
        - name: scope
          alias: 作用域
        - name: owner
          alias: 所有者
        - name: createTime
          alias: 创建时间
          format: datetime
        - name: updateTime
          alias: 更新时间
          format: datetime
  create:
    description: 创建搜索宏
    http:
      method: POST
      path: spl/macro
    params:
      body:
        - name: name
          type: string
          required: true
          description: 搜索宏名称 (必填)
        - name: description
          type: string
          description: 搜索宏描述
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: dynamic
          type: bool
          default: false
          description: 是否动态宏
        - name: definition
          type: string
          required: true
          description: SPL定义 (必填)
        - name: arguments
          type: string
          description: 参数定义
        - name: verify_statement
          field: verifyStatement
          type: string
          description: 验证语句
        - name: verify_fail_msg
          field: verifyFailMsg
          type: string
          description: 验证失败消息
    request_body:
      app: '{{ app | default("search") }}'
      name: '{{ name }}'
      description: '{{ description | default("") }}'
      dynamic: '{{ dynamic | default(false) }}'
      definition: '{{ definition }}'
      arguments: '{{ arguments | default("") }}'
      verifyStatement: '{{ verify_statement | default("") }}'
      verifyFailMsg: '{{ verify_fail_msg | default("") }}'
  update:
    description: 更新搜索宏
    http:
      method: PUT
      path: spl/macro/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
          description: 搜索宏名称
      body:
        - name: description
          type: string
          description: 搜索宏描述
        - name: app
          type: string
          description: 所属应用
        - name: dynamic
          type: bool
          description: 是否动态宏
        - name: definition
          type: string
          description: SPL定义
        - name: arguments
          type: string
          description: 参数定义
        - name: verify_statement
          field: verifyStatement
          type: string
          description: 验证语句
        - name: verify_fail_msg
          field: verifyFailMsg
          type: string
          description: 验证失败消息
    request_body:
      app: '{{ app }}'
      name: '{{ name }}'
      description: '{{ description | default("") }}'
      dynamic: '{{ dynamic | default(false) }}'
      definition: '{{ definition | default("") }}'
      arguments: '{{ arguments | default("") }}'
      verifyStatement: '{{ verify_statement | default("") }}'
      verifyFailMsg: '{{ verify_fail_msg | default("") }}'
  delete:
    description: 删除搜索宏
    http:
      method: DELETE
      path: spl/macro/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
          description: 搜索宏名称
  owner:
    description: 变更搜索宏所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/spl_macro
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 搜索宏名称列表（逗号分隔）
    request_body:
      owner: '{{ owner }}'
      assetId: '{{ asset_id | default([]) }}'
  grant:
    description: 授权搜索宏
    http:
      method: PUT
      path: auth/knowledge/bulk/spl_macro
    params:
      body:
        - name: grant
          type: string
          required: true
          multiple: true
          description: "授权项，格式 role:op1,op2,..."
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 宏 ID（可重复传递）
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名
    request_body:
      resourceIds: '{{ asset_id | default([]) }}'
      rolePerms: '{{ grant | default([]) }}'
      scope: '{{ scope | default("global") }}'
      app: '{{ app | default("search") }}'
  authority:
    description: 查看搜索宏权限
    http:
      method: GET
      path: auth/knowledge/spl_macro/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 宏 ID
