group: setting
name: token
description: API 访问令牌管理
path: auth/tokens
methods:
  list:
    description: 令牌列表
    http:
      method: GET
      path: auth/tokens
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
        - name: sort
          type: string
          default: issuedAt
          description: 排序字段
    output:
      items_path: $.tokens
      fields:
        - name: id
          alias: ID
        - name: username
          alias: 用户名
        - name: audience
          alias: 受众
        - name: expired
          alias: 过期
        - name: issuer
          alias: 发行者
        - name: status
          alias: 状态
        - name: lastAccessIP
          alias: 最后访问IP
        - name: lastAccessTime
          alias: 最后访问时间
          format: datetime
        - name: issuedAt
          alias: 发行时间
        - name: expireTime
          alias: 过期时间
          format: datetime
  create:
    description: 创建令牌
    http:
      method: POST
      path: auth/tokens
    params:
      body:
        - name: audience
          type: string
          description: 令牌受众
        - name: username
          type: string
          default: keta
          description: API 访问用户
        - name: expire_time
          field: expireTime
          type: int
          description: 过期时间（毫秒时间戳）
        - name: not_before
          field: notBefore
          type: int
          description: 生效时间（毫秒时间戳）
        - name: description
          type: string
          description: 令牌描述
    request_body:
      audience: '{{ audience | default("") }}'
      username: '{{ username | default("keta") }}'
      expireTime: '{{ expire_time | default(int(time.time()*1000) + 3600000) }}'
      notBefore: '{{ not_before | default(int(time.time()*1000)) }}'
      description: '{{ description | default("") }}'
  delete:
    description: 删除令牌
    http:
      method: DELETE
      path: auth/tokens/{{ token_id }}
    params:
      path:
        - name: token_id
          type: string
          required: true
          description: 令牌 ID
