group: admin
name: indices
description: KetaDB 分片管理
path: admin/internal/_cat/indices
methods:
  list:
    description: 分片 - list
    http:
      method: GET
      query:
        format: json
    output:
      items_path: $
      fields:
      - name: uuid
        alias: 索引UUID
      - name: index
        alias: 索引名称
      - name: index_type
        alias: 索引类型
      - name: pri
        alias: 主分片数量
      - name: rep
        alias: 副本分片数量
      - name: docs.count
        alias: 文档数量
      - name: docs.deleted
        alias: 删除文档数量
      - name: store.size
        alias: 索引大小
      - name: pri.store.size
        alias: 主分片大小
      - name: health
        alias: 健康状态
      - name: status
        alias: 状态
  get:
    description: 分片 - get
    http:
      method: GET
      path: admin/internal/{{ name }}/_settings
      query:
        format: json
    params:
      path:
      - name: name
        type: string
        required: true
  update:
    description: 分片 - update
    http:
      method: PUT
      path: admin/internal/{{ name }}/_settings
    params:
      body:
      - name: name
        type: string
        description: 索引名称
      - name: settings
        type: string
        description: 设置键值对，格式 key=value,key2=value2
      path:
      - name: name
        type: string
        required: true
  close:
    description: 分片 - close
    http:
      method: POST
      path: admin/internal/{{ name }}/_close
    params:
      path:
      - name: name
        type: string
        required: true
  open:
    description: 分片 - open
    http:
      method: POST
      path: admin/internal/{{ name }}/_open
    params:
      path:
      - name: name
        type: string
        required: true
  delete:
    description: 分片 - delete
    http:
      method: DELETE
      path: admin/internal/{{ name }}
    params:
      path:
      - name: name
        type: string
        required: true
