group: asset
name: extraction
description: 字段提取规则
path: extractions
methods:
  list:
    description: 字段提取规则列表
    http:
      method: GET
      path: extractions/list
  get:
    description: 字段提取规则详情
    http:
      method: GET
      path: extractions/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 提取规则 ID
  create:
    description: 创建字段提取规则
    http:
      method: POST
      path: extractions
    params:
      body:
        - name: name
          type: string
          description: 提取规则名称
        - name: description
          type: string
          description: 提取规则描述
        - name: extraction_type
          field: type
          type: string
          description: '提取类型: regex/delimiter/kv'
        - name: extraction_pattern
          field: pattern
          type: string
          description: 正则提取模式
        - name: extraction_delimiter
          field: delimiter
          type: string
          description: 分隔符
        - name: extraction_delimiter_kv
          field: delimiterKV
          type: string
          description: 键值对分隔符
        - name: sourcetype
          type: string
          description: 关联的源类型名称
        - name: indexed
          type: bool
          description: 是否索引
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: schema_field
          field: schemaField
          type: string
          description: 提取字段名
  delete:
    description: 删除字段提取规则
    http:
      method: POST
      path: extractions:batchDelete
    params:
      body:
        - name: id
          type: string
          required: true
          multiple: true
          description: 提取规则 ID (可多次传递)
    request_body:
      ids: '{{ id | tojson }}'
  owner:
    description: 变更字段提取规则所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/extraction
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: resource_ids
          field: resourceIds
          type: string
          required: true
          multiple: true
          description: 提取规则 ID (可多次传递)
    request_body:
      owner: '{{ owner }}'
      resourceIds: '{{ resource_ids | default([]) | tojson }}'
  grant:
    description: 授权字段提取规则
    http:
      method: PUT
      path: auth/knowledge/bulk/extraction
    params:
      body:
        - name: grant
          type: string
          required: true
          multiple: true
          description: 授权项，格式 role:op1,op2,...
        - name: asset_id
          field: resourceIds
          type: string
          required: true
          multiple: true
          description: 提取规则 ID (可多次传递)
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名
    request_body:
      resourceIds: '{{ asset_id | default([]) | tojson }}'
      rolePerms: '{{ grant | default([]) | tojson }}'
      scope: '{{ scope | default("global") }}'
      app: '{{ app | default("search") }}'
  authority:
    description: 查看字段提取规则权限
    http:
      method: GET
      path: auth/knowledge/extraction/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 提取规则 ID
