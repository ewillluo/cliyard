group: alert
name: rawevents
description: 告警原始事件
path: beacon
methods:
  timeline:
    description: 告警原始事件 - timeline
    http:
      method: GET
      path: beacon/events/{{ asset_id }}/timeline
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  list:
    description: 告警原始事件 - list
    http:
      method: GET
      path: beacon/rawevents
    params:
      query:
      - name: pageNo
        type: string
        default: 1
        description: ''
      - name: pageSize
        type: string
        default: 10
        description: ''
      - name: sort
        type: string
        default: createTime
        description: ''
      - name: order
        type: string
        default: desc
        description: ''
      - name: startTime
        type: string
        description: ''
      - name: endTime
        type: string
        description: ''
      - name: level
        type: string
        description: ''
      - name: assignee
        type: string
        description: ''
      - name: bizSystem
        type: string
        description: ''
      - name: groupId
        type: string
        default: -1
        description: ''
      - name: notice
        type: string
        description: ''
      - name: targetType
        type: string
        description: ''
      - name: prefix
        type: string
        description: ''
    output:
      items_path: $.events
      fields:
      - name: displayId
        alias: 事件编号
      - name: name
        alias: 名称
      - name: status
        alias: 状态
      - name: alertlevel
        alias: 级别
      - name: assignee
        alias: 负责人
      - name: appTitle
        alias: 应用
      - name: description
        alias: 描述
      - name: sceneType
        alias: 场景类型
      - name: workNode
        alias: 执行节点
      - name: bizSystemNames
        alias: 业务系统
      - name: querySpl
        alias: 查询语句
      - name: source
        alias: 来源
      - name: createTime
        alias: 创建时间
      - name: endTime
        alias: 结束时间
