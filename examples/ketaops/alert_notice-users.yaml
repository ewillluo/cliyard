group: alert
name: notice-users
description: 告警通知用户
path: beacon/notices
methods:
  list:
    description: 告警通知用户 - list
    http:
      method: GET
      path: beacon/notices/users
    output:
      items_path: $.users
      fields:
      - name: id
        alias: ID
      - name: identify
        alias: 用户标识
      - name: userInfo
        alias: 用户信息
      - name: phone
        alias: 手机号
      - name: mail
        alias: 邮箱
      - name: wechat
        alias: 企业微信
      - name: dingDing
        alias: 钉钉
      - name: remark
        alias: 备注
      - name: scope
        alias: 作用范围
      - name: app
        alias: 应用
  create:
    description: 告警通知用户 - create
    http:
      method: POST
      path: beacon/notices/user
    params:
      body:
      - name: identify
        type: string
        description: 用户标识 (必填)
      - name: userInfo
        type: string
        description: 用户信息 (必填)
      - name: phone
        type: string
        description: '手机号 (default: 空)'
      - name: mail
        type: string
        description: '邮箱配置 (default: {})'
      - name: wechat
        type: string
        description: '企业微信配置 (default: {})'
      - name: dingDing
        type: string
        description: '钉钉配置 (default: {})'
      - name: remark
        type: string
        description: '备注 (default: 空)'
  update:
    description: 告警通知用户 - update
    http:
      method: PUT
      path: beacon/notices/user/{{ id }}
    params:
      body:
      - name: identify
        type: string
        description: 用户标识 (必填)
      - name: userInfo
        type: string
        description: 用户信息 (必填)
      - name: phone
        type: string
        description: '手机号 (default: 空)'
      - name: mail
        type: string
        description: '邮箱配置 (default: {})'
      - name: wechat
        type: string
        description: '企业微信配置 (default: {})'
      - name: dingDing
        type: string
        description: '钉钉配置 (default: {})'
      - name: remark
        type: string
        description: '备注 (default: 空)'
      - name: userGroupIds
        type: string
        description: '用户组ID列表 (default: [])'
      path:
      - name: id
        type: string
        required: true
        description: id
  delete:
    description: 告警通知用户 - delete
    http:
      method: POST
      path: beacon/notices/user/batchDelete
  owner:
    description: 告警通知用户 - owner
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/alert_notice_user
    params:
      body:
      - name: owner
        type: string
        description: 新的所有者用户名
      - name: resource_ids
        type: string
        description: 告警通知用户ID列表（逗号分隔）
  grant:
    description: 告警通知用户 - grant
    http:
      method: PUT
      path: auth/knowledge/bulk/alert_notice_user
    params:
      body:
      - name: grant
        multiple: true
        description: 授权项，格式 role:op1,op2,...（可重复，如 admin:list,edit,delete）
      - name: asset_id
        type: string
        description: 通知用户 ID（可重复传递）
      - name: scope
        type: string
        description: 授权范围：private(私有)/app(应用)/global(全局)，默认 global
        default: global
      - name: app
        type: string
        description: 应用名（默认 search）
        default: search
  authority:
    description: 告警通知用户 - authority
    http:
      method: GET
      path: auth/knowledge/alert_notice_user/{{ asset_id }}
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
