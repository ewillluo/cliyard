group: target
name: manage
description: 运维资产对象
path: metric/targets
methods:
  list:
    description: 运维资产对象列表
    http:
      method: GET
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.items
      fields:
        - name: id
          alias: ID
        - name: name
          alias: 名称
        - name: app
          alias: 所属应用
        - name: identity
          alias: 身份
        - name: targetRule
          alias: 目标规则
        - name: targetType
          alias: 目标类型
        - name: metricCount
          alias: 指标数量
        - name: updateTime
          alias: 更新时间
          format: datetime
        - name: relationCount
          alias: 关联数量
  get:
    description: 运维资产对象详情
    http:
      method: GET
      path: metric/targets/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 运维资产对象 ID
  create:
    description: 创建运维资产对象
    http:
      method: POST
    params:
      body:
        - name: target_type_id
          field: targetTypeId
          type: string
          default: _storage_switch
          description: 目标类型ID
        - name: identity_name
          field: identityName
          type: string
          default: target_id
          description: 身份标识名称
        - name: name
          type: string
          default: target_name
          description: 目标名称
    request_body:
      targetTypeId: '{{ target_type_id | default("_storage_switch") }}'
      identities:
        name: '{{ identity_name | default("target_id") }}'
      names:
        name: '{{ name | default("target_name") }}'
      properties: {}
      customProperties: {}
  update:
    description: 更新运维资产对象
    http:
      method: PUT
      path: metric/targets/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 运维资产对象 ID
      body:
        - name: target_type_id
          field: targetTypeId
          type: string
          default: _storage_switch
          description: 目标类型ID
        - name: identity_name
          field: identityName
          type: string
          default: target_id
          description: 身份标识名称
        - name: name
          type: string
          default: target_name
          description: 目标名称
    request_body:
      targetTypeId: '{{ target_type_id | default("_storage_switch") }}'
      identities:
        name: '{{ identity_name | default("target_id") }}'
      names:
        name: '{{ name | default("target_name") }}'
      properties: {}
      customProperties: {}
      groupIds: []
  delete:
    description: 删除运维资产对象
    http:
      method: POST
      path: metric/targets:batchDelete
    params:
      body:
        - name: id
          type: string
          required: true
          multiple: true
          description: 运维资产对象 ID (可多次传递)
    request_body:
      ids:
        - '{{ id }}'
  owner:
    description: 变更运维资产对象所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/target
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 运维资产对象ID列表（逗号分隔）
    request_body:
      owner: '{{ owner }}'
      assetId: '{{ asset_id | default([]) }}'
  grant:
    description: 授权运维资产对象
    http:
      method: PUT
      path: auth/knowledge/bulk/target
    params:
      body:
        - name: grant
          type: string
          required: true
          multiple: true
          description: "授权项，格式 role:op1,op2,..."
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 运维资产对象 ID（可重复传递）
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名
    request_body:
      resourceIds: '{{ asset_id | default([]) }}'
      rolePerms: '{{ grant | default([]) }}'
      scope: '{{ scope | default("global") }}'
      app: '{{ app | default("search") }}'
  authority:
    description: 查看运维资产对象权限
    http:
      method: GET
      path: auth/knowledge/target/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 运维资产对象 ID
