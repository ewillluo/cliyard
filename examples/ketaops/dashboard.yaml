group: asset
name: dashboard
description: 仪表盘管理
path: dashboard
methods:
  list:
    description: 仪表盘列表
    http:
      method: GET
    params:
      query:
        - name: page
          type: int
          default: 1
        - name: per_page
          type: int
          default: 20
    output:
      items_path: $.dashboards
      fields:
        - name: id
          alias: ID
        - name: name
          alias: 名称
        - name: title
          alias: 标题
        - name: app
          alias: 应用
        - name: dashboardType
          alias: 类型
  create:
    description: 创建仪表盘(支持 chart YAML 转 Pithos XML)
    type: plugin:dashboard_create
    config:
      endpoint: /api/v1/dashboard
    params:
      body:
        - name: id
          type: string
          required: true
          description: 仪表盘 ID
        - name: name
          type: string
          description: 仪表盘名称
        - name: title
          type: string
          description: 仪表盘标题
        - name: description
          type: string
          description: 仪表盘描述
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: chart_file
          type: file
          description: Chart YAML 配置文件路径
  get:
    description: 获取仪表盘详情(支持 --chart-yaml 输出)
    type: plugin:dashboard_get
    config:
      endpoint: /api/v1/dashboard
    params:
      path:
        - name: name
          type: string
          required: true
          description: 仪表盘名称
      body:
        - name: chart_yaml
          type: bool
          default: false
          description: 以 chart DSL YAML 格式输出
  update:
    description: 更新仪表盘(支持 chart YAML 重新生成图表)
    type: plugin:dashboard_update
    config:
      endpoint: /api/v1/dashboard
    params:
      path:
        - name: id
          type: string
          required: true
          description: 仪表盘 ID
      body:
        - name: name
          type: string
          description: 仪表盘名称
        - name: title
          type: string
          description: 仪表盘标题
        - name: description
          type: string
          description: 仪表盘描述
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: chart_file
          type: file
          description: Chart YAML 配置文件路径 (可选，更新图表内容)
  delete:
    description: 删除仪表盘
    http:
      method: DELETE
      path: dashboard/{{ id }}
    params:
      path:
        - name: id
          type: string
          required: true
          description: 仪表盘 ID
  owner:
    description: 变更仪表盘所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/dashboard
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: asset_id
          field: assetId
          type: string
          multiple: true
          description: 资源ID (可多次传递)
    request_body:
      owner: '{{ owner }}'
      assetId: '{{ asset_id | default([]) }}'

  grant:
    description: 授权仪表盘
    http:
      method: PUT
      path: auth/knowledge/bulk/dashboard
    params:
      body:
        - name: grant
          type: string
          multiple: true
        - name: asset_id
          field: assetId
          type: string
          multiple: true
        - name: scope
          type: string
          default: global
        - name: app
          type: string
          default: search

  authority:
    description: 查看仪表盘权限
    http:
      method: GET
      path: auth/knowledge/dashboard/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
