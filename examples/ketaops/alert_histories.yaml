group: alert
name: histories
description: 告警执行历史
path: alerts
methods:
  list:
    description: 告警执行历史 - list
    http:
      method: GET
      path: alerts/{{ alertId }}/histories
    params:
      query:
      - name: pageNo
        type: string
        default: 1
        description: ''
      - name: pageSize
        type: string
        default: 10
        description: ''
      - name: sort
        type: string
        default: time
        description: ''
      - name: order
        type: string
        default: desc
        description: ''
      path:
      - name: alertId
        type: string
        required: true
        description: alertId
    output:
      items_path: $.histories
      fields:
      - name: time
        alias: 时间
      - name: count
        alias: 触发次数
      - name: status
        alias: 状态
      - name: tookMillis
        alias: 执行时间(ms)
      - name: workNode
        alias: 执行节点
      - name: errMsg
        alias: 错误信息
      - name: conditionRecord
        alias: 条件记录
      - name: startTime
        alias: 开始时间
      - name: endTime
        alias: 结束时间
  get:
    description: 告警执行历史 - get
    http:
      method: GET
      path: alerts/{{ alertId }}/histories/{{ historyId }}
    params:
      path:
      - name: alertId
        type: string
        required: true
        description: alertId
      - name: historyId
        type: string
        required: true
        description: historyId
