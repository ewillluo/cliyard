group: setting
name: user
description: 用户管理
path: auth/users
methods:
  list:
    description: 用户列表
    http:
      method: GET
    params:
      query:
        - name: page
          type: int
          default: 1
        - name: per_page
          type: int
          default: 20
    output:
      items_path: $.users
      fields:
        - name: username
          alias: 用户名
        - name: userType
          alias: 用户类型
        - name: roles
          alias: 角色
        - name: status
          alias: 状态
        - name: phone
          alias: 手机号
        - name: mail
          alias: 邮箱
  create:
    description: 创建用户
    http:
      method: POST
      path: auth/user
    params:
      body:
        - name: name
          type: string
          required: true
          description: 用户名
        - name: password
          type: string
          default: "12345678"
          description: 密码
        - name: phone
          type: string
          description: 手机号
        - name: role
          type: enum
          choices: [general_user, admin, readonly]
          default: general_user
          description: 用户角色
        - name: email
          type: string
          description: 邮箱
  delete:
    description: 删除用户
    http:
      method: DELETE
      path: auth/user/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
          description: 用户名
