name: doc
description: 文档
path: pithos/appcontents/keta_docs/view
methods:
  get:
    description: 查看文档
    http:
      method: GET
      path: pithos/appcontents/keta_docs/view/{{ name }}.xml
    params:
      path:
        - name: name
          type: enum
          choices:
            - developer_api_documentation
            - search1_command_manual
            - search2_command_manual
            - sdk_documentation
            - app_development_handbook
            - concepts
            - tutorial
            - components
            - actions
            - configuration
          required: true
          description: 文档名称
    output:
      fields:
        - name: name
          alias: 文档名称
        - name: title
          alias: 文档标题
        - name: description
          alias: 描述
        - name: headings
          alias: 目录
