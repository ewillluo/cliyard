group: alert
name: notices
description: 触发操作
path: beacon/notices
methods:
  list:
    description: 触发操作 - list
    http:
      method: GET
    output:
      items_path: $.notices
      fields:
      - name: id
        alias: ID
      - name: name
        alias: 名称
      - name: type
        alias: 类型
      - name: app
        alias: 应用
      - name: description
        alias: 描述
      - name: createTime
        alias: 创建时间
  get:
    description: 触发操作 - get
    http:
      method: GET
      path: beacon/notices/{{ asset_id }}
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  create:
    description: 触发操作 - create
    http:
      method: POST
    params:
      body:
      - name: name
        type: string
        description: 通知名称 (必填)
      - name: notice_type
        type: string
        description: '通知类型 (default: user)'
      - name: app
        type: string
        description: '所属应用 (default: keta_metrics)'
      - name: description
        type: string
        description: '通知描述 (default: 空)'
      - name: alertType
        type: string
        description: '告警类型 (default: event)'
      - name: user_name
        type: string
        description: '通知用户名 (default: keta)'
  update:
    description: 触发操作 - update
    http:
      method: PUT
      path: beacon/notices/{{ asset_id }}
    params:
      body:
      - name: name
        type: string
        description: '通知名称 (default: 空)'
      - name: notice_type
        type: string
        description: '通知类型 (default: user)'
      - name: app
        type: string
        description: '所属应用 (default: keta_metrics)'
      - name: description
        type: string
        description: '通知描述 (default: 空)'
      - name: alertType
        type: string
        description: '告警类型 (default: event)'
      - name: user_name
        type: string
        description: '通知用户名 (default: keta)'
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  delete:
    description: 触发操作 - delete
    http:
      method: DELETE
      path: beacon/notices/{{ asset_id }}
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  owner:
    description: 触发操作 - owner
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/alert_notices
    params:
      body:
      - name: owner
        type: string
        description: 新的所有者用户名
      - name: resource_ids
        type: string
        description: 触发操作ID列表（逗号分隔）
  grant:
    description: 触发操作 - grant
    http:
      method: PUT
      path: auth/knowledge/bulk/alert_notices
    params:
      body:
      - name: grant
        multiple: true
        description: 授权项，格式 role:op1,op2,...（可重复，如 admin:list,edit,delete）
      - name: asset_id
        type: string
        description: 触发操作 ID（可重复传递）
      - name: scope
        type: string
        description: 授权范围：private(私有)/app(应用)/global(全局)，默认 global
        default: global
      - name: app
        type: string
        description: 应用名（默认 search）
        default: search
  authority:
    description: 触发操作 - authority
    http:
      method: GET
      path: auth/knowledge/alert_notices/{{ asset_id }}
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
