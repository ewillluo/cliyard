group: alert
name: templates
description: 告警通知模板
path: beacon/alert
methods:
  list:
    description: 告警通知模板 - list
    http:
      method: GET
      path: beacon/alert/templates/list
    output:
      items_path: $.templates
      fields:
      - name: id
        alias: ID
      - name: name
        alias: 名称
      - name: description
        alias: 描述
      - name: notifyMode
        alias: 通知方式
      - name: alertType
        alias: 告警类型
      - name: app
        alias: 应用
      - name: preset
        alias: 预设
      - name: scope
        alias: 范围
      - name: createTime
        alias: 创建时间
  get:
    description: 告警通知模板 - get
    http:
      method: GET
      path: beacon/alert/template/{{ asset_id }}
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  create:
    description: 告警通知模板 - create
    http:
      method: POST
      path: beacon/alert/template
    params:
      body:
      - name: name
        type: string
        description: 模板名称 (必填)
      - name: description
        type: string
        description: '模板描述 (default: 空)'
      - name: notify_mode
        type: string
        description: '通知方式 (default: dingDing)'
      - name: title
        type: string
        description: '通知标题 (default: 空)'
      - name: content
        type: string
        description: 通知内容 (必填)
      - name: content_type
        type: string
        description: '内容类型 (default: markdown)'
      - name: alertType
        type: string
        description: '告警类型 (default: event)'
      - name: content_parser
        type: string
        description: '内容解析器 (default: freemarker)'
      - name: app
        type: string
        description: '所属应用 (default: keta_metrics)'
  update:
    description: 告警通知模板 - update
    http:
      method: PUT
      path: beacon/alert/template/{{ asset_id }}
    params:
      body:
      - name: name
        type: string
        description: '模板名称 (default: 空)'
      - name: description
        type: string
        description: '模板描述 (default: 空)'
      - name: notify_mode
        type: string
        description: '通知方式 (default: dingDing)'
      - name: title
        type: string
        description: '通知标题 (default: 空)'
      - name: content
        type: string
        description: '通知内容 (default: 空)'
      - name: content_type
        type: string
        description: '内容类型 (default: markdown)'
      - name: alertType
        type: string
        description: '告警类型 (default: event)'
      - name: content_parser
        type: string
        description: '内容解析器 (default: freemarker)'
      - name: app
        type: string
        description: '所属应用 (default: keta_metrics)'
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
  delete:
    description: 告警通知模板 - delete
    http:
      method: DELETE
      path: beacon/alert/templates
  owner:
    description: 告警通知模板 - owner
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/alert_templates
    params:
      body:
      - name: owner
        type: string
        description: 新的所有者用户名
      - name: resource_ids
        type: string
        description: 告警通知模板ID列表（逗号分隔）
  grant:
    description: 告警通知模板 - grant
    http:
      method: PUT
      path: auth/knowledge/bulk/alert_templates
    params:
      body:
      - name: grant
        multiple: true
        description: 授权项，格式 role:op1,op2,...（可重复，如 admin:list,edit,delete）
      - name: asset_id
        type: string
        description: 通知模板 ID（可重复传递）
      - name: scope
        type: string
        description: 授权范围：private(私有)/app(应用)/global(全局)，默认 global
        default: global
      - name: app
        type: string
        description: 应用名（默认 search）
        default: search
  authority:
    description: 告警通知模板 - authority
    http:
      method: GET
      path: auth/knowledge/alert_templates/{{ asset_id }}
    params:
      path:
      - name: asset_id
        type: string
        required: true
        description: asset_id
