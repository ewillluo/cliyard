name: dc-type
description: KetaAgent 采集模板
path: dc/collect/types
methods:
  list:
    description: 采集模板列表
    http:
      method: GET
      path: dc/collect/types
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.types
      fields:
        - name: name
          alias: 名称
        - name: title
          alias: 标题
        - name: app
          alias: 所属应用
        - name: template
          alias: 采集模板
        - name: updateTime
          alias: 更新时间
