name: role
description: 角色管理
path: auth/roles
methods:
  list:
    description: 角色列表
    http:
      method: GET
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.roles
      fields:
        - name: name
          alias: 名称
        - name: desc
          alias: 描述
        - name: usernames
          alias: 关联用户
        - name: type
          alias: 类型
        - name: expireTime
          alias: 过期时间
