group: admin
name: allocation
description: KetaDB 分片分配
path: admin/internal/_cat/allocation
methods:
  list:
    description: KetaDB 分片分配 - list
    http:
      method: GET
      query:
        format: json
  explain:
    description: KetaDB 分片分配 - explain
    http:
      method: GET
      path: admin/internal/_cluster/allocation/explain
      query:
        format: json
    output:
      items_path: $
      fields:
      - name: index
        alias: 索引名称
      - name: shard
        alias: 分片
      - name: primary
        alias: 主/副本
      - name: current_state
        alias: 当前状态
      - name: allocate_explanation
        alias: 分配原因
  get:
    description: KetaDB 分片分配 - get
    http:
      method: POST
      path: admin/internal/_cluster/allocation/explain
    params:
      body:
      - name: index
        type: string
        description: 索引名称
      - name: shard
        type: string
        description: 分片编号
      - name: primary
        type: string
        description: 是否主分片
