group: dc
name: k8s-rule
description: KetaAgent 容器采集任务
path: dc/kubernetes/collector/rule
methods:
  list:
    description: 容器采集任务列表
    http:
      method: GET
    output:
      items_path: $.rules
      fields:
        - name: name
          alias: 名称
        - name: description
          alias: 描述
        - name: enabled
          alias: 是否开启
        - name: clusters
          alias: 采集集群
        - name: namespaces
          alias: 采集命名空间
        - name: collectTypeName
          alias: 采集类型
        - name: updateTime
          alias: 更新时间
          format: datetime
