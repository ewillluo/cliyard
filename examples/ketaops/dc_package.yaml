name: dc-package
description: KetaAgent 安装包
path: dc/package
methods:
  list:
    description: 安装包列表
    http:
      method: GET
      path: dc/package/list
    output:
      items_path: $.packages
      fields:
        - name: name
          alias: 名称
        - name: version
          alias: 版本
        - name: arch
          alias: 架构
        - name: os
          alias: 操作系统
        - name: createTime
          alias: 创建时间
          format: datetime
  download:
    description: 下载安装包
    http:
      method: GET
      path: dc/package/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 安装包 ID
