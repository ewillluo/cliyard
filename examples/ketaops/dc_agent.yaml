group: dc
name: agent
description: KetaAgent Agent实例
path: dc/agent/list
methods:
  list:
    description: Agent实例列表
    http:
      method: GET
      path: dc/agent/list
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.agents
      fields:
        - name: id
          alias: ID
        - name: hostName
          alias: 主机名
        - name: ip
          alias: IP
        - name: version
          alias: 版本
        - name: os
          alias: 操作系统
        - name: arch
          alias: 架构
        - name: tasksNum
          alias: 采集任务数
        - name: runtime
          alias: 运行时
        - name: updateTime
          alias: 更新时间
          format: datetime
  detail:
    description: Agent实例详情
    http:
      method: GET
      path: dc/agent/detail/{{ agent_id }}
    params:
      path:
        - name: agent_id
          type: string
          required: true
          description: Agent ID
  uninstall:
    description: 卸载Agent
    http:
      method: PUT
      path: dc/agent/uninstall
    params:
      body:
        - name: agent_id
          field: agentIds
          type: string
          required: true
          multiple: true
          description: Agent ID (可多次传递)
  status:
    description: 管理Agent状态（休眠/唤醒）
    http:
      method: POST
      path: dc/agent:status
    params:
      body:
        - name: asset_id
          field: ids
          required: true
          multiple: true
          description: Agent ID (可多次传递，如 --asset-id a --asset-id b)
        - name: action
          type: enum
          choices: [suspend, awake]
          default: suspend
          description: 操作类型
  setting:
    description: 配置Agent运行参数
    http:
      method: PUT
      path: dc/agent/setting
    params:
      body:
        - name: agent_id
          field: agentIds
          type: string
          required: true
          multiple: true
          description: Agent ID (可多次传递)
        - name: log_level
          field: logLevel
          type: string
          default: info
          description: 日志级别
        - name: use_custom
          field: useCustom
          type: bool
          description: 是否自定义配置
        - name: cpu_limit
          field: cpuLimit
          type: int
          default: 1
          description: CPU限制(核)
        - name: mem_rate
          field: memRate
          type: int
          default: 10
          description: 内存限制比例(%)
        - name: disk_rate
          field: diskRate
          type: int
          default: 10
          description: 磁盘限制比例(%)
        - name: auto_awake
          field: autoAwake
          type: bool
          description: 是否自动唤醒
        - name: monitor_enabled
          field: monitorEnabled
          type: bool
          default: true
          description: 是否开启基础监控
        - name: monitor_interval
          field: monitorInterval
          type: int
          default: 30
          description: 基础监控采集间隔(秒)
        - name: infra_enabled
          field: infraEnabled
          type: bool
          default: true
          description: 是否开启基础设施监控
        - name: infra_interval
          field: infraInterval
          type: int
          default: 30
          description: 基础设施监控采集间隔(秒)
        - name: event_server_enabled
          field: eventServerEnabled
          type: bool
          description: 是否开启事件服务
        - name: event_server_port
          field: eventServerPort
          type: int
          default: 10007
          description: 事件服务端口
        - name: trace_enabled
          field: traceEnabled
          type: bool
          description: 是否开启调用链
        - name: retention_enabled
          field: retentionEnabled
          type: bool
          description: 是否开启离线保留
        - name: retention_days
          field: retentionDays
          type: int
          default: 30
          description: 离线保留天数
        - name: max_offline_time_millis
          field: maxOfflineTimeMillis
          type: int
          description: 离线保留毫秒数
        - name: health_checker_enabled
          field: healthCheckerEnabled
          type: bool
          description: 是否开启健康检查
        - name: ebpf_enabled
          field: ebpfEnabled
          type: bool
          description: 是否开启eBPF
    request_body:
      agentIds: '{{ agent_id | tojson }}'
      useCustom: '{{ use_custom | default(true) }}'
      logConfig:
        level: '{{ log_level | default("info") }}'
      resourceLimit:
        cpuLimit: '{{ cpu_limit | default(1) }}'
        memRate: '{{ mem_rate | default(10) }}'
        memSize: 0
        diskRate: '{{ disk_rate | default(10) }}'
        diskSize: 0
        autoAwake: '{{ auto_awake | default(false) }}'
      monitor:
        agent:
          enabled: '{{ monitor_enabled | default(true) }}'
          interval: '{{ monitor_interval | default(30) }}'
      infrastructure:
        enabled: '{{ infra_enabled | default(true) }}'
        interval: '{{ infra_interval | default(30) }}'
      eventServer:
        enabled: '{{ event_server_enabled | default(false) }}'
        port: '{{ event_server_port | default(10007) }}'
      traceSetting:
        enabled: '{{ trace_enabled | default(false) }}'
      retention:
        enabled: '{{ retention_enabled | default(false) }}'
        maxOfflineTimeMillis: '{{ max_offline_time_millis | default(retention_days * 86400000) | int }}'
      healthChecker:
        enabled: '{{ health_checker_enabled | default(false) }}'
      ebpfAgent:
        enabled: '{{ ebpf_enabled | default(false) }}'
  delete:
    description: 删除Agent
    http:
      method: DELETE
      path: dc/agent/list/{{ agent_ids }}
    params:
      path:
        - name: agent_ids
          type: string
          required: true
          description: Agent ID (逗号分隔多个)
  get_global_setting:
    description: 获取Agent全局配置
    http:
      method: GET
      path: dc/agent/setting/global
  global_setting:
    description: 配置Agent全局运行参数
    http:
      method: PUT
      path: dc/agent/setting/global
    params:
      body:
        - name: log_level
          field: logLevel
          type: string
          default: info
          description: 日志级别
        - name: use_custom
          field: useCustom
          type: bool
          description: 是否自定义配置
        - name: cpu_limit
          field: cpuLimit
          type: int
          default: 1
          description: CPU限制(核)
        - name: mem_rate
          field: memRate
          type: int
          default: 10
          description: 内存限制比例(%)
        - name: disk_rate
          field: diskRate
          type: int
          default: 10
          description: 磁盘限制比例(%)
        - name: auto_awake
          field: autoAwake
          type: bool
          description: 是否自动唤醒
        - name: monitor_enabled
          field: monitorEnabled
          type: bool
          default: true
          description: 是否开启基础监控
        - name: monitor_interval
          field: monitorInterval
          type: int
          default: 30
          description: 基础监控采集间隔(秒)
        - name: infra_enabled
          field: infraEnabled
          type: bool
          default: true
          description: 是否开启基础设施监控
        - name: infra_interval
          field: infraInterval
          type: int
          default: 30
          description: 基础设施监控采集间隔(秒)
        - name: event_server_enabled
          field: eventServerEnabled
          type: bool
          description: 是否开启事件服务
        - name: event_server_port
          field: eventServerPort
          type: int
          default: 10007
          description: 事件服务端口
        - name: trace_enabled
          field: traceEnabled
          type: bool
          description: 是否开启调用链
        - name: retention_enabled
          field: retentionEnabled
          type: bool
          description: 是否开启离线保留
        - name: retention_days
          field: retentionDays
          type: int
          default: 30
          description: 离线保留天数
        - name: max_offline_time_millis
          field: maxOfflineTimeMillis
          type: int
          description: 离线保留毫秒数
        - name: health_checker_enabled
          field: healthCheckerEnabled
          type: bool
          description: 是否开启健康检查
        - name: ebpf_enabled
          field: ebpfEnabled
          type: bool
          description: 是否开启eBPF
    request_body:
      useCustom: '{{ use_custom | default(true) }}'
      logConfig:
        level: '{{ log_level | default("info") }}'
      resourceLimit:
        cpuLimit: '{{ cpu_limit | default(1) }}'
        memRate: '{{ mem_rate | default(10) }}'
        memSize: 0
        diskRate: '{{ disk_rate | default(10) }}'
        diskSize: 0
        autoAwake: '{{ auto_awake | default(false) }}'
      monitor:
        agent:
          enabled: '{{ monitor_enabled | default(true) }}'
          interval: '{{ monitor_interval | default(30) }}'
      infrastructure:
        enabled: '{{ infra_enabled | default(true) }}'
        interval: '{{ infra_interval | default(30) }}'
      eventServer:
        enabled: '{{ event_server_enabled | default(false) }}'
        port: '{{ event_server_port | default(10007) }}'
      traceSetting:
        enabled: '{{ trace_enabled | default(false) }}'
      retention:
        enabled: '{{ retention_enabled | default(false) }}'
        maxOfflineTimeMillis: '{{ max_offline_time_millis | default(retention_days * 86400000) | int }}'
      healthChecker:
        enabled: '{{ health_checker_enabled | default(false) }}'
      ebpfAgent:
        enabled: '{{ ebpf_enabled | default(false) }}'
