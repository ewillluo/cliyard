group: admin
name: disk
description: KetaDB 磁盘使用
path: admin/disk/explain
methods:
  list:
    description: KetaDB 磁盘使用 - list
    http:
      method: GET
      query:
        format: json
    output:
      items_path: $
      fields:
      - name: settings.diskThresholdLow
        alias: 低水位阈值
      - name: settings.diskThresholdHigh
        alias: 高水位阈值
      - name: settings.diskThresholdFlood
        alias: 洪水阈值
      - name: nodeCount
        alias: 节点数量
      - name: healthyNodeCount
        alias: 健康节点数量
      - name: unhealthyNodeCount
        alias: 不健康节点数量
      - name: subHealthyNodeCount
        alias: 子健康节点数量
  explain:
    description: KetaDB 磁盘使用 - explain
    http:
      method: GET
      query:
        format: json
