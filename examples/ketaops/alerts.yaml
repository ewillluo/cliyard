name: alert
description: 告警规则管理
path: alerts
methods:
  list:
    description: 告警规则列表
    http:
      method: GET
      path: alerts
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.alertRules
      fields:
        - name: id
          alias: ID
        - name: name
          alias: 名称
        - name: description
          alias: 描述
        - name: owner
          alias: 负责人
        - name: app
          alias: 应用
        - name: status
          alias: 状态
        - name: recovery
          alias: 恢复
  get:
    description: 告警规则详情
    http:
      method: GET
      path: alerts/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 告警规则 ID
  create:
    description: 创建告警规则
    http:
      method: POST
      path: alerts
    params:
      body:
        - name: name
          type: string
          required: true
          description: 告警规则名称 (必填)
        - name: description
          type: string
          description: 告警规则描述
        - name: app
          type: string
          default: keta_metrics
          description: 所属应用
        - name: scene_type
          field: sceneType
          type: string
          default: custom
          description: 场景类型
        - name: data_source
          field: dataSource
          type: string
          default: spl
          description: 数据源类型
        - name: spl
          type: string
          required: true
          description: SPL 查询语句 (必填)
        - name: range_duration
          field: rangeDuration
          type: int
          default: 5
          description: 检测范围时长
        - name: range_unit
          field: rangeUnit
          type: string
          default: m
          description: 检测范围时间单位
        - name: event_subjects
          field: eventSubjects
          type: string
          description: 事件主体字段
        - name: level
          type: string
          default: p1
          description: 告警级别
        - name: trigger_field
          field: triggerField
          type: string
          required: true
          description: 触发字段 (必填)
        - name: trigger_type
          field: triggerType
          type: string
          default: gte
          description: 触发条件类型
        - name: threshold
          type: int
          default: 1
          description: 触发阈值
        - name: frequency_minute
          field: frequencyMinute
          type: int
          default: 5
          description: 执行频率(分钟)
        - name: recovery_type
          field: recoveryType
          type: string
          default: period
          description: 恢复方式
        - name: recovery
          type: int
          default: 3
          description: 恢复周期(次)
        - name: repeated_triggers
          field: repeatedTriggers
          type: int
          default: 1
          description: 重复触发次数
        - name: run_condition
          field: runCondition
          type: string
          description: 生效时间配置 (JSON格式)
    request_body:
      name: '{{ name }}'
      description: '{{ description | default("") }}'
      app: '{{ app | default("keta_metrics") }}'
      sceneType: '{{ scene_type | default("custom") }}'
      type: normal
      condition:
        dataSource: '{{ data_source | default("spl") }}'
        spl: '{{ spl }}'
        dataset: ''
        range:
          startRelated:
            duration: '{{ range_duration | default(5) }}'
            timeUnit: '{{ range_unit | default("m") }}'
          endRelated:
            duration: 0
            timeUnit: m
          fragment: true
        eventSubjects:
          - '{{ event_subjects | default(trigger_field) }}'
        judgeLevels:
          - level: '{{ level | default("p1") }}'
            judgements:
              - logic: or
                field: '{{ trigger_field }}'
                trigger:
                  type: '{{ trigger_type | default("gte") }}'
                  threshold: '{{ threshold | default(1) }}'
                  value: ''
                  judgeNumber: true
                  fragment: true
            fragment: true
        additionContents: []
        noDataLevel:
          enabled: false
          level: null
          fragment: true
        recoveryFields: null
        dynamicFields: null
        subRules: null
        timeWindow: null
        fragment: true
        viewConfig: null
        logic: or
      frequency:
        type: cronDate
        cronDate:
          frequency: minute
          month: 0
          date: 0
          hour: 0
          minute: '{{ frequency_minute | default(5) }}'
      recoveryType: '{{ recovery_type | default("period") }}'
      sendAttachment: false
      recoveryEnable: true
      recovery: '{{ recovery | default(3) }}'
      repeatedTriggers: '{{ repeated_triggers | default(1) }}'
      recoveryCondition: []
      runCondition: '{{ run_condition | default("null") }}'
      suppressionEnable: false
      suppressions: []
      notices: []
      noticeUpgrades: []
      enabled: true
      status: normal
      groupIds: []
      targetBindInfo: []
      eventNameTpl: null
      eventDescTpl: null
      eventDescType: null
      noticeShield: 0
  delete:
    description: 删除告警规则
    http:
      method: DELETE
      path: alerts
    params:
      body:
        - name: id
          type: string
          required: true
          multiple: true
          description: 告警规则 ID (可多次传递)
    request_body:
      id:
        - '{{ id }}'
  owner:
    description: 变更告警规则所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/alert_rules
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 告警规则ID列表（逗号分隔）
    request_body:
      owner: '{{ owner }}'
      assetId: '{{ asset_id | default([]) }}'
  grant:
    description: 授权告警规则
    http:
      method: PUT
      path: auth/knowledge/bulk/alert_rules
    params:
      body:
        - name: grant
          type: string
          required: true
          multiple: true
          description: "授权项，格式 role:op1,op2,..."
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 告警规则 ID（可重复传递）
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名
    request_body:
      resourceIds: '{{ asset_id | default([]) }}'
      rolePerms: '{{ grant | default([]) }}'
      scope: '{{ scope | default("global") }}'
      app: '{{ app | default("search") }}'
  authority:
    description: 查看告警规则权限
    http:
      method: GET
      path: auth/knowledge/alert_rules/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 告警规则 ID
