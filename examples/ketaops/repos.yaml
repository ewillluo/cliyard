group: asset
name: repo
description: 仓库管理
path: repos
methods:
  list:
    description: 仓库列表
    http:
      method: GET
    params:
      query:
        - name: with_doc_size
          field: withDocSize
          type: bool
          default: true
          description: 是否返回文档大小
        - name: page
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: page_size
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.repos
      total_path: $.total
      fields:
        - name: name
          alias: 仓库名称
        - name: type
          alias: 仓库类型
        - name: description
          alias: 描述
        - name: bytes
          alias: 大小
        - name: docTotal
          alias: 文档数
  create:
    description: 创建仓库
    http:
      method: POST
      path: repos/{{ name }}
    params:
      body:
        - name: name
          type: string
          required: true
          description: 仓库名称 (必填)
        - name: repo_type
          type: enum
          choices: [EVENTS, METRICS, TRACES]
          default: EVENTS
          description: 仓库类型 (EVENTS, METRICS, TRACES)
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: description
          type: string
          description: 仓库描述
        - name: global_config
          type: bool
          default: true
          description: 是否全局配置
        - name: owner
          type: string
          default: keta
          description: 所有者
        - name: store_type
          type: string
          default: RETENTION
          description: 存储类型 (RETENTION, ...)
        - name: capacity_size_value
          type: int
          default: 50
          description: 容量大小
        - name: capacity_size_unit
          type: string
          default: GB
          description: 容量单位
        - name: write_shards
          type: int
          default: 1
          description: 写入分片数
        - name: shards_upper_bound
          type: int
          default: 4
          description: 分片上限
        - name: repo_replicas
          type: int
          default: 1
          description: 副本数
        - name: write_replicas
          type: int
          default: 1
          description: 写入副本数
        - name: raw_store
          type: string
          default: COMPRESSED_STRING
          description: 原始存储方式
        - name: index_codec
          type: string
          default: "default"
          description: 索引编码
        - name: shard_max_docs
          type: int
          default: 100000000
          description: 分片最大文档数
        - name: shard_max_size
          type: string
          default: 50gb
          description: 分片最大大小
        - name: index_max_age
          type: string
          default: 2592000s
          description: 索引最大保留时间
        - name: ilm_hot
          type: int
          default: 0
          description: 热副本数
        - name: ilm_warm
          type: int
          default: 0
          description: 温副本数
        - name: ilm_cold
          type: int
          default: 0
          description: 冷副本数
        - name: write_refresh_interval
          type: int
          default: 1
          description: 写入刷新间隔(秒)
        - name: lifecycle_policy_enable
          type: bool
          default: false
          description: 启用生命周期策略
        - name: retention
          type: int
          default: -1
          description: 数据保留天数 (-1 永久)
    request_body:
      name: '{{ name }}'
      type: '{{ repo_type | default("EVENTS") }}'
      app: '{{ app | default("search") }}'
      description: '{{ description | default("") }}'
      globalConfig: '{{ global_config | default(true) }}'
      roles: []
      groupIds: []
      owner: '{{ owner | default("keta") }}'
      storeType: '{{ store_type | default("RETENTION") }}'
      capacity:
        sizeValue: '{{ capacity_size_value | default(50) }}'
        sizeUnit: '{{ capacity_size_unit | default("GB") }}'
      writeShards: '{{ write_shards | default(1) }}'
      shardsUpperBound: '{{ shards_upper_bound | default(4) }}'
      repoReplicas: '{{ repo_replicas | default(1) }}'
      writeReplicas: '{{ write_replicas | default(1) }}'
      rawStore: '{{ raw_store | default("COMPRESSED_STRING") }}'
      fields: []
      indexCodec: '{{ index_codec | default("default") }}'
      rollOverIndex:
        shardMaxDocs: '{{ shard_max_docs | default(100000000) }}'
        shardMaxSize: '{{ shard_max_size | default("50gb") }}'
        indexMaxAge: '{{ index_max_age | default("2592000s") }}'
      ilmReplicas:
        hot: '{{ ilm_hot | default(0) }}'
        warm: '{{ ilm_warm | default(0) }}'
        cold: '{{ ilm_cold | default(0) }}'
      writeRefreshIntervalInSeconds: '{{ write_refresh_interval | default(1) }}'
      lifecyclePolicyEnable: '{{ lifecycle_policy_enable | default(false) }}'
      retention: '{{ retention | default(-1) }}'
  get:
    description: 仓库详情
    http:
      method: GET
      path: repos/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
          description: 仓库名称
  update:
    description: 更新仓库
    http:
      method: PUT
      path: repos/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
      body:
        - name: description
          type: string
        - name: retention
          type: int
  delete:
    description: 删除仓库
    http:
      method: POST
      path: repos:batchDelete
    params:
      body:
        - name: names
          type: string
          required: true
          multiple: true
          description: 仓库名称 (可多次传递，如 --name a --name b)
