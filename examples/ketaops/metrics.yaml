name: metric
description: 指标管理
path: metric/metrics
methods:
  list:
    description: 指标列表
    http:
      method: GET
      path: metric/metrics
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.metrics
      fields:
        - name: name
          alias: 名称
        - name: key
          alias: 指标key
        - name: description
          alias: 描述
        - name: appTitle
          alias: 应用标题
        - name: calculation
          alias: 计算
        - name: level
          alias: 层级
        - name: measureType
          alias: 测量类型
        - name: origin
          alias: 来源
        - name: createTime
          alias: 创建时间
        - name: updateTime
          alias: 更新时间
  get:
    description: 指标详情
    http:
      method: GET
      path: metric/metrics/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 指标 ID
  create:
    description: 创建指标
    http:
      method: POST
      path: metric/metrics
    params:
      body:
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: name
          type: string
          required: true
          description: 指标名称 (必填)
        - name: key
          type: string
          required: true
          description: 指标键值 (必填)
        - name: group
          type: string
          default: default
          description: 分组
        - name: level
          type: string
          default: P2
          description: "指标等级: P0/P1/P2/P3/P4"
        - name: calculation
          type: string
          default: "avg,max,min,sum"
          description: 计算方法，逗号分隔
        - name: origin
          type: string
          default: custom
          description: 来源
        - name: measure_type
          field: measureType
          type: string
          default: Gauge
          description: "测量类型: Gauge/Counter/Histogram"
        - name: category
          type: string
          default: General
          description: 类别
        - name: metric_nature
          field: metricNature
          type: string
          default: temp
          description: 指标性质
        - name: unit
          type: string
          default: none
          description: 单位
        - name: description
          type: string
          description: 描述
        - name: label
          type: string
          description: 标签
    request_body:
      app: '{{ app | default("search") }}'
      key: '{{ key }}'
      name: '{{ name }}'
      group: '{{ group | default("default") }}'
      level: '{{ level | default("P2") }}'
      calculation: '{{ calculation | default("avg,max,min,sum") }}'
      origin: '{{ origin | default("custom") }}'
      measureType: '{{ measure_type | default("Gauge") }}'
      category: '{{ category | default("General") }}'
      metricNature: '{{ metric_nature | default("temp") }}'
      unit: '{{ unit | default("none") }}'
      description: '{{ description | default("") }}'
      label: '{{ label | default("") }}'
  update:
    description: 更新指标
    http:
      method: PUT
      path: metric/metrics/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 指标 ID
      body:
        - name: name
          type: string
          description: 指标名称
        - name: key
          type: string
          description: 指标键值
        - name: app
          type: string
          description: 所属应用
        - name: description
          type: string
          description: 描述
        - name: group
          type: string
          description: 分组
        - name: level
          type: string
          description: "指标等级: P0/P1/P2/P3/P4"
        - name: calculation
          type: string
          description: 计算方法
        - name: origin
          type: string
          description: 来源
        - name: measure_type
          field: measureType
          type: string
          description: 测量类型
        - name: category
          type: string
          description: 类别
        - name: metric_nature
          field: metricNature
          type: string
          description: 指标性质
        - name: unit
          type: string
          description: 单位
        - name: label
          type: string
          description: 标签
    request_body:
      name: '{{ name }}'
      key: '{{ key | default("") }}'
      app: '{{ app | default("search") }}'
      description: '{{ description | default("") }}'
      group: '{{ group | default("default") }}'
      level: '{{ level | default("P2") }}'
      calculation: '{{ calculation | default("avg,max,min,sum") }}'
      origin: '{{ origin | default("custom") }}'
      measureType: '{{ measure_type | default("Gauge") }}'
      category: '{{ category | default("General") }}'
      metricNature: '{{ metric_nature | default("temp") }}'
      unit: '{{ unit | default("none") }}'
      label: '{{ label | default("") }}'
  owner:
    description: 变更指标所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/metric
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: 指标ID列表（逗号分隔）
    request_body:
      owner: '{{ owner }}'
      assetId: '{{ asset_id | default([]) }}'
  grant:
    description: 授权指标
    http:
      method: PUT
      path: auth/knowledge/bulk/metric
    params:
      body:
        - name: grant
          type: string
          required: true
          multiple: true
          description: "授权项，格式 role:op1,op2,..."
        - name: asset_id
          field: assetId
          type: string
          required: true
          multiple: true
          description: Metric ID（可重复传递）
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名
    request_body:
      resourceIds: '{{ asset_id | default([]) }}'
      rolePerms: '{{ grant | default([]) }}'
      scope: '{{ scope | default("global") }}'
      app: '{{ app | default("search") }}'
  authority:
    description: 查看指标权限
    http:
      method: GET
      path: auth/knowledge/metric/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 指标 ID
