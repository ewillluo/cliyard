description: 账套查询
methods:
  list:
    description: 账套查询
    http:
      method: POST
      path: /supplier-customer-import/query-out-account
    params:
      body:
      - name: supplierCode
        type: string
        description: supplierCode
      - name: brandId
        type: int
        description: brandId
      - name: brandIdList
        type: int
        multiple: true
    request_body:
      brandId: '{{ brandId }}'
      brandIdList: '{{ brandIdList | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
  list-more:
    description: 账套查询
    http:
      method: POST
      path: /supplier-customer-import/more-query-out-account
    params:
      body:
      - name: supplierCode
        type: string
        description: supplierCode
      - name: brandId
        type: int
        description: brandId
      - name: brandIdList
        type: int
        multiple: true
    request_body:
      brandId: '{{ brandId }}'
      brandIdList: '{{ brandIdList | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
