description: 公共接口
methods:
  list-dept:
    description: 根据员工工号获取所属部门信息
    http:
      method: POST
      path: /crm/admin/v1/public/dept-list
    params:
      body:
      - name: empCode
        type: string
        required: true
    request_body:
      empCode: '{{ empCode }}'
  list-dept-leader:
    description: 根据员工工号获取所负责部门列表
    http:
      method: POST
      path: /crm/admin/v1/public/dept-leader-list
    params:
      body:
      - name: leaderCodes
        type: string
        required: true
    request_body:
      leaderCodes: '{{ leaderCodes }}'
  list-dept-tree:
    description: 根据部门标获取组织架构信息
    http:
      method: POST
      path: /crm/admin/v1/public/dept-tree-list
    params:
      body:
      - name: deptCodes
        type: string
        required: true
    request_body:
      deptCodes: '{{ deptCodes }}'
  list-region:
    description: 查询对应的地区列表
    http:
      method: POST
      path: /crm/admin/v1/public/region-list
    params:
      body:
      - name: id
        type: int
        description: 地区ID
        required: true
      - name: level
        type: int
        description: 地区等级
        required: true
      - name: name
        type: string
        description: 地区名称
        required: true
      - name: parentId
        type: int
        description: 地区父ID
        required: true
    request_body:
      id: '{{ id }}'
      level: '{{ level }}'
      name: '{{ name }}'
      parentId: '{{ parentId }}'
  list-brand-by-name:
    description: 根据品牌名称获取品牌信息
    http:
      method: POST
      path: /crm/admin/v1/public/brand-info-list-name
    params:
      body:
      - name: name
        type: string
        required: true
      - name: isHaveTrademark
        type: int
        required: true
      - name: pageSize
        type: string
        required: true
      - name: pageNo
        type: string
        required: true
    request_body:
      isHaveTrademark: '{{ isHaveTrademark }}'
      name: '{{ name }}'
      pageNo: '{{ pageNo }}'
      pageSize: '{{ pageSize }}'
  list-uom:
    description: 获取所有计量单位
    http:
      method: POST
      path: /crm/admin/v1/public/get-uom-list
  upload:
    description: 上传文件
    http:
      method: POST
      path: /api/v1/public/upload
    params:
      body: []
      query:
      - name: type
        type: string
        description: type
        required: true
  get-category:
    description: 获取顶级分类
    http:
      method: POST
      path: /crm/admin/v1/public/get-category
    params:
      body:
      - name: parentId
        type: string
        description: 父级id
      - name: status
        type: string
        description: 状态1有效 0无效
    request_body:
      parentId: '{{ parentId }}'
      status: '{{ status }}'
  list-supplier:
    description: 获取有效供应商
    http:
      method: POST
      path: /crm/admin/v1/public/get-supplier-list
  list-narrow-line:
    description: 获取十线分类列表
    http:
      method: POST
      path: /supplier-customer-import/get-narrow-line-list
  file-upload:
    description: 文件上传(crm)
    http:
      method: POST
      path: /crm/admin/v1/file/upload
  list-narrow-line-sub:
    description: 获取产品线子分类列表
    http:
      method: POST
      path: /supplier-customer-import/get-narrow-line-sub-list
    params:
      body:
      - name: narrowLineIds
        type: int
        description: 十大品类ID列表
        multiple: true
    request_body:
      narrowLineIds: '{{ narrowLineIds | default(''[]'') }}'
