description: 加盟商管理
methods:
  list:
    description: 分页查询加盟商信息
    http:
      method: POST
      path: /supplier-customer-import/page-list-partner
    params:
      body:
      - name: pageIndex
        type: int
        description: 页码
        required: true
      - name: pageSize
        type: int
        description: 每页大小
        required: true
      - name: id
        type: int
        required: true
      - name: applyNo
        type: string
        description: 申请单号
        required: true
      - name: supplierName
        type: string
        description: 供应商名称
        required: true
      - name: supplierCode
        type: string
        description: 供应商代码
        required: true
      - name: status
        type: int
        description: 状态
        multiple: true
        required: true
      - name: createByName
        type: string
        description: 创建人
        required: true
      - name: createAtStart
        type: string
        description: 创建时间开始
        required: true
      - name: createAtEnd
        type: string
        description: 创建时间结束
        required: true
      - name: applyUserName
        type: string
        description: 申请人
        required: true
      - name: applyTimeStart
        type: string
        description: 申请时间开始
        required: true
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
        required: true
      - name: applicationType
        type: int
        description: 供应商引入类型
        required: true
      - name: originType
        type: int
        description: 数据来源
        required: true
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
        required: true
      - name: firstDeptId
        type: int
        description: 一级部门id
        required: true
      - name: secondDeptId
        type: int
        description: 二级部门id
        required: true
      - name: thirdDeptId
        type: int
        description: 三级部门id
        required: true
      - name: fourthDeptId
        type: int
        description: 四级部门id
        required: true
      - name: userNoList
        type: string
        description: 筛选组织架构下的员工
        multiple: true
        required: true
    request_body:
      body:
        id: '{{ body_id }}'
        applyNo: '{{ body_applyNo }}'
        supplierName: '{{ body_supplierName }}'
        supplierCode: '{{ body_supplierCode }}'
        status: '{{ body_status }}'
        createByName: '{{ body_createByName }}'
        createAtStart: '{{ body_createAtStart }}'
        createAtEnd: '{{ body_createAtEnd }}'
        applyUserName: '{{ body_applyUserName }}'
        applyTimeStart: '{{ body_applyTimeStart }}'
        applyTimeEnd: '{{ body_applyTimeEnd }}'
        applicationType: '{{ body_applicationType }}'
        originType: '{{ body_originType }}'
        isApplicantLeader: '{{ body_isApplicantLeader }}'
        firstDeptId: '{{ body_firstDeptId }}'
        secondDeptId: '{{ body_secondDeptId }}'
        thirdDeptId: '{{ body_thirdDeptId }}'
        fourthDeptId: '{{ body_fourthDeptId }}'
        userNoList: '{{ body_userNoList }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  export:
    description: 导出加盟商信息
    http:
      method: POST
      path: /supplier-customer-import/export-partner
    params:
      body:
      - name: id
        type: int
      - name: applyNo
        type: string
        description: 申请单号
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商代码
      - name: status
        type: int
        description: 状态
        multiple: true
      - name: createByName
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 创建时间开始
      - name: createAtEnd
        type: string
        description: 创建时间结束
      - name: applyUserName
        type: string
        description: 申请人
      - name: applyTimeStart
        type: string
        description: 申请时间开始
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
      - name: applicationType
        type: int
        description: 供应商引入类型
      - name: originType
        type: int
        description: 数据来源
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
      - name: firstDeptId
        type: int
        description: 一级部门id
      - name: secondDeptId
        type: int
        description: 二级部门id
      - name: thirdDeptId
        type: int
        description: 三级部门id
      - name: fourthDeptId
        type: int
        description: 四级部门id
      - name: userNoList
        type: string
        description: 筛选组织架构下的员工
        multiple: true
    request_body:
      applicationType: '{{ applicationType }}'
      applyNo: '{{ applyNo }}'
      applyTimeEnd: '{{ applyTimeEnd }}'
      applyTimeStart: '{{ applyTimeStart }}'
      applyUserName: '{{ applyUserName }}'
      createAtEnd: '{{ createAtEnd }}'
      createAtStart: '{{ createAtStart }}'
      createByName: '{{ createByName }}'
      firstDeptId: '{{ firstDeptId }}'
      fourthDeptId: '{{ fourthDeptId }}'
      id: '{{ id }}'
      isApplicantLeader: '{{ isApplicantLeader }}'
      originType: '{{ originType }}'
      secondDeptId: '{{ secondDeptId }}'
      status: '{{ status | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
      supplierName: '{{ supplierName }}'
      thirdDeptId: '{{ thirdDeptId }}'
      userNoList: '{{ userNoList | default(''[]'') }}'
  delete:
    description: 删除加盟商
    http:
      method: POST
      path: /supplier-customer-import/delete-partner
    params:
      body:
      - name: id
        type: int
    request_body:
      id: '{{ id }}'
  reset:
    description: 加盟商审核撤回提交
    http:
      method: POST
      path: /supplier-customer-import/reset-partner
    params:
      body:
      - name: id
        type: int
      - name: applyNo
        type: string
        description: 申请单号
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商代码
      - name: status
        type: int
        description: 状态
        multiple: true
      - name: createByName
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 创建时间开始
      - name: createAtEnd
        type: string
        description: 创建时间结束
      - name: applyUserName
        type: string
        description: 申请人
      - name: applyTimeStart
        type: string
        description: 申请时间开始
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
      - name: applicationType
        type: int
        description: 供应商引入类型
      - name: originType
        type: int
        description: 数据来源
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
      - name: firstDeptId
        type: int
        description: 一级部门id
      - name: secondDeptId
        type: int
        description: 二级部门id
      - name: thirdDeptId
        type: int
        description: 三级部门id
      - name: fourthDeptId
        type: int
        description: 四级部门id
      - name: userNoList
        type: string
        description: 筛选组织架构下的员工
        multiple: true
    request_body:
      applicationType: '{{ applicationType }}'
      applyNo: '{{ applyNo }}'
      applyTimeEnd: '{{ applyTimeEnd }}'
      applyTimeStart: '{{ applyTimeStart }}'
      applyUserName: '{{ applyUserName }}'
      createAtEnd: '{{ createAtEnd }}'
      createAtStart: '{{ createAtStart }}'
      createByName: '{{ createByName }}'
      firstDeptId: '{{ firstDeptId }}'
      fourthDeptId: '{{ fourthDeptId }}'
      id: '{{ id }}'
      isApplicantLeader: '{{ isApplicantLeader }}'
      originType: '{{ originType }}'
      secondDeptId: '{{ secondDeptId }}'
      status: '{{ status | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
      supplierName: '{{ supplierName }}'
      thirdDeptId: '{{ thirdDeptId }}'
      userNoList: '{{ userNoList | default(''[]'') }}'
  list-number:
    description: 获取加盟商筛选数据
    http:
      method: POST
      path: /supplier-customer-import/list-partner-number
    params:
      body:
      - name: id
        type: int
      - name: applyNo
        type: string
        description: 申请单号
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商代码
      - name: status
        type: int
        description: 状态
        multiple: true
      - name: createByName
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 创建时间开始
      - name: createAtEnd
        type: string
        description: 创建时间结束
      - name: applyUserName
        type: string
        description: 申请人
      - name: applyTimeStart
        type: string
        description: 申请时间开始
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
      - name: applicationType
        type: int
        description: 供应商引入类型
      - name: originType
        type: int
        description: 数据来源
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
      - name: firstDeptId
        type: int
        description: 一级部门id
      - name: secondDeptId
        type: int
        description: 二级部门id
      - name: thirdDeptId
        type: int
        description: 三级部门id
      - name: fourthDeptId
        type: int
        description: 四级部门id
      - name: userNoList
        type: string
        description: 筛选组织架构下的员工
