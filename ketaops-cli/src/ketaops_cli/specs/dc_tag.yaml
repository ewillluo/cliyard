name: dc-tag
description: KetaAgent 标签管理
path: dc/tags
methods:
  list:
    description: 标签列表
    http:
      method: GET
      path: dc/tags
    output:
      items_path: $.tags
      fields:
        - name: id
          alias: ID
        - name: name
          alias: 名称
        - name: key
          alias: 标签键
        - name: description
          alias: 描述
        - name: agentsName
          alias: 关联Agent
        - name: updateTime
          alias: 更新时间
          format: datetime
  get:
    description: 标签详情
    http:
      method: GET
      path: dc/tag/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 标签 ID
  create:
    description: 创建标签
    http:
      method: POST
      path: dc/tag
    params:
      body:
        - name: name
          type: string
          required: true
          description: 标签名称
        - name: key
          type: string
          description: 标签键
        - name: description
          type: string
          default: ""
          description: 标签描述
    request_body:
      name: '{{ name }}'
      key: '{{ key | default("") }}'
      description: '{{ description | default("") }}'
  update:
    description: 更新标签
    http:
      method: PUT
      path: dc/tag/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 标签 ID
      body:
        - name: name
          type: string
          description: 标签名称
        - name: key
          type: string
          description: 标签键
        - name: description
          type: string
          description: 标签描述
        - name: agent_ids
          field: agentIds
          type: string
          multiple: true
          description: 关联Agent ID (可多次传递)
  delete:
    description: 删除标签
    http:
      method: DELETE
      path: dc/tags/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 标签 ID
  owner:
    description: 变更标签所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/dc_tag
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: resource_ids
          field: resourceIds
          type: string
          multiple: true
          description: 标签 ID (可多次传递)
    request_body:
      owner: '{{ owner }}'
      resourceIds: '{{ resource_ids | default([]) | tojson }}'
  grant:
    description: 授权标签
    http:
      method: PUT
      path: auth/knowledge/bulk/dc_tag
    params:
      body:
        - name: grant
          type: string
          required: true
          multiple: true
          description: 授权项，格式 role:op1,op2,...
        - name: asset_id
          field: resourceIds
          type: string
          required: true
          multiple: true
          description: 标签 ID (可多次传递)
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名
    request_body:
      resourceIds: '{{ asset_id | default([]) | tojson }}'
      rolePerms: '{{ grant | default([]) | tojson }}'
      scope: '{{ scope | default("global") }}'
      app: '{{ app | default("search") }}'
  authority:
    description: 查看标签权限
    http:
      method: GET
      path: auth/knowledge/dc_tag/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 标签 ID
  install-link:
    description: 获取安装链接
    http:
      method: GET
      path: dc/install/link
