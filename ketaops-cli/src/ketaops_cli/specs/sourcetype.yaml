description: 来源类型管理
path: sourcetype
methods:
  list:
    description: 来源类型列表
    http:
      method: GET
      path: sourcetype
    params:
      query:
        - name: pageNo
          field: pageNo
          type: int
          default: 1
          description: 页码
        - name: pageSize
          field: pageSize
          type: int
          default: 20
          description: 每页条数
    output:
      items_path: $.sourcetypes
      fields:
        - name: name
          alias: 名称
        - name: appTitle
          alias: 应用名称
        - name: description
          alias: 描述
        - name: createTime
          alias: 创建时间
        - name: updateTime
          alias: 更新时间
  get:
    description: 来源类型详情
    http:
      method: GET
      path: sourcetype/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
          description: 来源类型名称
  create:
    description: 创建来源类型
    http:
      method: POST
      path: sourcetype/{{ name }}
    params:
      body:
        - name: name
          type: string
          required: true
          description: 来源类型名称
        - name: app
          type: string
          default: search
          description: 所属应用
        - name: line_type
          field: lineType
          type: string
          default: single
          description:  "行类型: single/multi/regex"
        - name: line_regex
          field: lineRegex
          type: string
          description: 行正则表达式
        - name: datetime_type
          field: datetimeType
          type: string
          default: now
          description:  "日期时间提取方式: now/regex/advanced"
        - name: datetime_zone_offset
          field: datetimeZoneOffset
          type: int
          default: 8
          description: 时区偏移
        - name: datetime_format
          field: datetimeFormat
          type: string
          description: 日期时间格式模板
        - name: datetime_prefix
          field: datetimePrefix
          type: string
          description: 日期时间前缀
        - name: datetime_max_length
          field: datetimeMaxLength
          type: int
          default: 100
          description: 日期时间最大长度
        - name: description
          type: string
          description: 来源类型描述
        - name: category
          type: string
          default: custom
          description: 来源类型分类
        - name: charset
          type: string
          default: utf-8
          description: 字符编码
        - name: field_discovery
          field: fieldDiscovery
          type: bool
          default: false
          description: 是否自动发现字段
    request_body:
      app: '{{ app | default("search") }}'
      name: '{{ name }}'
      line:
        type: '{{ line_type | default("single") }}'
        regex: '{{ line_regex | default("") }}'
      datetime:
        type: '{{ datetime_type | default("now") }}'
        zoneOffset: '{{ datetime_zone_offset | default(8) }}'
        dateTimeFormat: '{{ datetime_format | default("") }}'
        dateTimePrefix: '{{ datetime_prefix | default("") }}'
        maxDateTimeLength: '{{ datetime_max_length | default(100) }}'
      description: '{{ description | default("") }}'
      category: '{{ category | default("custom") }}'
      advance:
        charset: '{{ charset | default("utf-8") }}'
        fieldDiscovery: '{{ field_discovery | default(false) }}'
      groupIds: []
      id: ''
      preset: 0
      extractions: []
  update:
    description: 更新来源类型
    http:
      method: PUT
      path: sourcetype/{{ name }}
    params:
      path:
        - name: name
          type: string
          required: true
          description: 来源类型名称
      body:
        - name: app
          type: string
          description: 所属应用
        - name: description
          type: string
          description: 来源类型描述
        - name: category
          type: string
          description: 来源类型分类
        - name: line_type
          field: lineType
          type: string
          description:  "行类型: single/multi/regex"
        - name: line_regex
          field: lineRegex
          type: string
          description: 行正则表达式
        - name: datetime_type
          field: datetimeType
          type: string
          description: 日期时间提取方式
        - name: datetime_zone_offset
          field: datetimeZoneOffset
          type: int
          description: 时区偏移
        - name: datetime_format
          field: datetimeFormat
          type: string
          description: 日期时间格式模板
        - name: datetime_prefix
          field: datetimePrefix
          type: string
          description: 日期时间前缀
        - name: datetime_max_length
          field: datetimeMaxLength
          type: int
          description: 日期时间最大长度
        - name: charset
          type: string
          description: 字符编码
        - name: field_discovery
          field: fieldDiscovery
          type: bool
          description: 是否自动发现字段
    request_body:
      app: '{{ app | default("search") }}'
      name: '{{ name }}'
      line:
        type: '{{ line_type | default("single") }}'
        regex: '{{ line_regex | default("") }}'
      datetime:
        type: '{{ datetime_type | default("now") }}'
        zoneOffset: '{{ datetime_zone_offset | default(8) }}'
        dateTimeFormat: '{{ datetime_format | default("") }}'
        dateTimePrefix: '{{ datetime_prefix | default("") }}'
        maxDateTimeLength: '{{ datetime_max_length | default(100) }}'
      description: '{{ description | default("") }}'
      category: '{{ category | default("custom") }}'
      advance:
        charset: '{{ charset | default("utf-8") }}'
        fieldDiscovery: '{{ field_discovery | default(false) }}'
      groupIds: []
  delete:
    description: 删除来源类型
    http:
      method: POST
      path: sourcetype:batchDelete
    params:
      body:
        - name: name
          type: string
          required: true
          multiple: true
          description: 来源类型名称 (可多次传递)
    request_body:
      names:
        - '{{ name }}'
  owner:
    description: 变更来源类型所有者
    http:
      method: PUT
      path: auth/knowledge/owner/bulk/extraction
    params:
      body:
        - name: owner
          type: string
          required: true
          description: 新的所有者用户名
        - name: asset_id
          field: assetId
          type: string
          multiple: true
          description: 资源ID (可多次传递)
    request_body:
      owner: '{{ owner }}'
      assetId: '{{ asset_id | default([]) }}'

  grant:
    description: 授权来源类型
    http:
      method: PUT
      path: auth/knowledge/bulk/extraction
    params:
      body:
        - name: grant
          type: string
          multiple: true
          description: '授权项，格式 role:op1,op2 (可重复)'
        - name: asset_id
          field: assetId
          type: string
          multiple: true
          description: 资源ID (可重复)
        - name: scope
          type: string
          default: global
          description: 授权范围
        - name: app
          type: string
          default: search
          description: 应用名

  authority:
    description: 查看来源类型权限
    http:
      method: GET
      path: auth/knowledge/extraction/{{ asset_id }}
    params:
      path:
        - name: asset_id
          type: string
          required: true
          description: 资源ID
