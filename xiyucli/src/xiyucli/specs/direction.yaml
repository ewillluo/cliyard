description: 定向列表管理
methods:
  list:
    description: 分页查询定向供应商基础信息
    http:
      method: POST
      path: /crm/admin/v1/cdm/ecological-supplier-basic-information
    params:
      body:
      - name: pageIndex
        type: int
        description: 页码
        required: true
      - name: pageSize
        type: int
        description: 每页大小
        required: true
      - name: id
        type: int
        description: id
        required: true
      - name: applyNo
        type: string
        description: applyNo
        required: true
      - name: supplierName
        type: string
        description: supplierName
        required: true
      - name: supplierCode
        type: string
        description: supplierCode
        required: true
      - name: status
        type: string
        description: status
        multiple: true
        required: true
      - name: createByName
        type: string
        description: createByName
        required: true
      - name: createAtStart
        type: string
        description: createAtStart
        required: true
      - name: createAtEnd
        type: string
        description: createAtEnd
        required: true
      - name: applyUserName
        type: string
        description: applyUserName
        required: true
      - name: applyTimeStart
        type: string
        description: applyTimeStart
        required: true
      - name: applyTimeEnd
        type: string
        description: applyTimeEnd
        required: true
      - name: applicationType
        type: int
        description: applicationType
        required: true
      - name: originType
        type: int
        description: originType
        required: true
      - name: isApplicantLeader
        type: bool
        description: isApplicantLeader
        required: true
      - name: firstDeptId
        type: int
        description: firstDeptId
        required: true
      - name: secondDeptId
        type: int
        description: secondDeptId
        required: true
      - name: thirdDeptId
        type: int
        description: thirdDeptId
        required: true
      - name: fourthDeptId
        type: int
        description: fourthDeptId
        required: true
      - name: userNoList
        type: string
        description: userNoList
        multiple: true
        required: true
    request_body:
      body:
        id: '{{ body_id }}'
        applyNo: '{{ body_applyNo }}'
        supplierName: '{{ body_supplierName }}'
        supplierCode: '{{ body_supplierCode }}'
        status: '{{ body_status }}'
        createByName: '{{ body_createByName }}'
        createAtStart: '{{ body_createAtStart }}'
        createAtEnd: '{{ body_createAtEnd }}'
        applyUserName: '{{ body_applyUserName }}'
        applyTimeStart: '{{ body_applyTimeStart }}'
        applyTimeEnd: '{{ body_applyTimeEnd }}'
        applicationType: '{{ body_applicationType }}'
        originType: '{{ body_originType }}'
        isApplicantLeader: '{{ body_isApplicantLeader }}'
        firstDeptId: '{{ body_firstDeptId }}'
        secondDeptId: '{{ body_secondDeptId }}'
        thirdDeptId: '{{ body_thirdDeptId }}'
        fourthDeptId: '{{ body_fourthDeptId }}'
        userNoList: '{{ body_userNoList }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
