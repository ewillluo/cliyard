description: 品牌垂直管理
methods:
  update:
    description: 编辑品牌垂直业代
    http:
      method: POST
      path: /supplier-customer-import/edit-ecological-supplier-brand-info
    params:
      body:
      - name: isNewSupplier
        type: bool
        description: 是否新供应商
        default: false
      - name: businessLicense
        type: string
        description: 营业执照URL
      - name: businessLicenseFileName
        type: string
        description: 营业执照文件名
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商编号
      - name: taxIdNumber
        type: string
        description: 纳税识别号
      - name: warehouseArea
        type: string
        description: 仓库面积（㎡）
      - name: storeArea
        type: string
        description: 门店面积（㎡）
      - name: provinceId
        type: int
        description: 办公所在地省ID
      - name: provinceName
        type: string
        description: 办公所在地省
      - name: cityId
        type: int
        description: 办公所在地市ID
      - name: cityName
        type: string
        description: 办公所在地市
      - name: detailAddress
        type: string
        description: 办公所在地详细地址
      - name: signatoryName
        type: string
        description: 协议签署人姓名
      - name: signatoryJob
        type: string
        description: 协议签署人职务
      - name: signatoryJobStr
        type: string
        description: 协议签署人职务显示值
      - name: signatoryEmail
        type: string
        description: 协议签署人邮箱
      - name: signatoryPhone
        type: string
        description: 协议签署人手机号
      - name: contactName
        type: string
        description: 联系人姓名
      - name: position
        type: string
        description: 职务
      - name: positionStr
        type: string
        description: 职务显示值
      - name: email
        type: string
        description: 邮箱
      - name: phoneNumber
        type: string
        description: 联系方式
      - name: id
        type: int
        description: 品牌垂直业务申请信息Id
      - name: introduceAuditUserNo
        type: string
        description: 引入组审核人
      - name: groupCompanyId
        type: int
        description: 集团公司ID
      - name: groupCompanyName
        type: string
        description: 集团公司
      - name: cooperationProfit
        type: float
        description: 合作毛利
      - name: isGroupDimensionCooperation
        type: int
        description: 是否集团维度合作
      - name: isEndorsementPayment
        type: int
        description: 统一设置账期为背书付款 1-是 0-否
      - name: actualOrderingCompany_id
        type: int
        description: ID
      - name: actualOrderingCompanyId
        type: int
        description: 实际下单公司Id
      - name: actualOrderingCompanyText
        type: string
        description: 实际下单公司
      - name: contactPerson
        type: int
        description: 联系人Id
      - name: contactPersonText
        type: string
        description: 联系人
      - name: actualOrderingCompany_position
        type: string
        description: 职务
      - name: actualOrderingCompany_email
        type: string
        description: 邮箱
      - name: actualOrderingCompany_phoneNumber
        type: string
        description: 联系方式
      - name: dockingCompanyId
        type: int
        description: 对接公司id
      - name: dockingCompanyText
        type: string
        description: 对接公司
      - name: expectedAnnualCooperationAmount
        type: string
        description: 预计年度合作金额
      - name: actualOrderingCompany_cooperationProfit
        type: float
        description: 合作毛利
      - name: actualOrderingCompany_isEndorsementPayment
        type: int
        description: 是否设置账期为背书付款 1-是 0-否
      - name: importChannelType
        type: int
        description: '引入通道类型 1:历史合作记录通道 2: 窄线专业能力通道'
      - name: categoryInfo_id
        type: int
        description: 主键ID
      - name: applicationType
        type: int
        description: 类型，1供应商引入，2新增合作
      - name: categoryInfo_introduceAuditUserNo
        type: string
        description: 引入组审核人
      - name: area
        type: float
        description: 自有/租赁仓库或门店面积（㎡）
      - name: annualIncome
        type: float
        description: 年报营业收入（万元）
      - name: employNumber
        type: int
        description: 参保人数
    request_body:
      supplierBasicInfo:
        isNewSupplier: '{{ supplierBasicInfo_isNewSupplier | default(False) }}'
        businessLicense: '{{ supplierBasicInfo_businessLicense }}'
        businessLicenseFileName: '{{ supplierBasicInfo_businessLicenseFileName }}'
        supplierName: '{{ supplierBasicInfo_supplierName }}'
        supplierCode: '{{ supplierBasicInfo_supplierCode }}'
        taxIdNumber: '{{ supplierBasicInfo_taxIdNumber }}'
        warehouseArea: '{{ supplierBasicInfo_warehouseArea }}'
        storeArea: '{{ supplierBasicInfo_storeArea }}'
        provinceId: '{{ supplierBasicInfo_provinceId }}'
        provinceName: '{{ supplierBasicInfo_provinceName }}'
        cityId: '{{ supplierBasicInfo_cityId }}'
        cityName: '{{ supplierBasicInfo_cityName }}'
        detailAddress: '{{ supplierBasicInfo_detailAddress }}'
        signatoryName: '{{ supplierBasicInfo_signatoryName }}'
        signatoryJob: '{{ supplierBasicInfo_signatoryJob }}'
        signatoryJobStr: '{{ supplierBasicInfo_signatoryJobStr }}'
        signatoryEmail: '{{ supplierBasicInfo_signatoryEmail }}'
        signatoryPhone: '{{ supplierBasicInfo_signatoryPhone }}'
        contactName: '{{ supplierBasicInfo_contactName }}'
        position: '{{ supplierBasicInfo_position }}'
        positionStr: '{{ supplierBasicInfo_positionStr }}'
        email: '{{ supplierBasicInfo_email }}'
        phoneNumber: '{{ supplierBasicInfo_phoneNumber }}'
      brandInfo:
        id: '{{ brandInfo_id }}'
        introduceAuditUserNo: '{{ brandInfo_introduceAuditUserNo }}'
      groupCompany:
        groupCompanyId: '{{ groupCompany_groupCompanyId }}'
        groupCompanyName: '{{ groupCompany_groupCompanyName }}'
        cooperationProfit: '{{ groupCompany_cooperationProfit }}'
        isGroupDimensionCooperation: '{{ groupCompany_isGroupDimensionCooperation }}'
        groupDimensionAttachment: '{{ groupCompany_groupDimensionAttachment }}'
        isEndorsementPayment: '{{ groupCompany_isEndorsementPayment }}'
      actualOrderingCompany:
        id: '{{ actualOrderingCompany_id }}'
        actualOrderingCompanyId: '{{ actualOrderingCompany_actualOrderingCompanyId }}'
        actualOrderingCompanyText: '{{ actualOrderingCompany_actualOrderingCompanyText }}'
        contactPerson: '{{ actualOrderingCompany_contactPerson }}'
        contactPersonText: '{{ actualOrderingCompany_contactPersonText }}'
        position: '{{ actualOrderingCompany_position }}'
        email: '{{ actualOrderingCompany_email }}'
        phoneNumber: '{{ actualOrderingCompany_phoneNumber }}'
        dockingCompanyId: '{{ actualOrderingCompany_dockingCompanyId }}'
        dockingCompanyText: '{{ actualOrderingCompany_dockingCompanyText }}'
        expectedAnnualCooperationAmount: '{{ actualOrderingCompany_expectedAnnualCooperationAmount }}'
        cooperationProfit: '{{ actualOrderingCompany_cooperationProfit }}'
        isEndorsementPayment: '{{ actualOrderingCompany_isEndorsementPayment }}'
        importChannelType: '{{ actualOrderingCompany_importChannelType }}'
        cooperationRecordDoc: '{{ actualOrderingCompany_cooperationRecordDoc }}'
      categoryInfo:
        id: '{{ categoryInfo_id }}'
        applicationType: '{{ categoryInfo_applicationType }}'
        introduceAuditUserNo: '{{ categoryInfo_introduceAuditUserNo }}'
        area: '{{ categoryInfo_area }}'
        areaDoc: '{{ categoryInfo_areaDoc }}'
        annualIncome: '{{ categoryInfo_annualIncome }}'
        taxDoc: '{{ categoryInfo_taxDoc }}'
        employNumber: '{{ categoryInfo_employNumber }}'
        employDoc: '{{ categoryInfo_employDoc }}'
      categoryRegions: '{{ categoryRegions | default(''[]'') }}'
      supplierAuthorization: '{{ supplierAuthorization | default(''[]'') }}'
  list:
    description: 分页查询品牌垂直信息
    http:
      method: POST
      path: /supplier-customer-import/page-list-brand
    params:
      body:
      - name: pageIndex
        type: int
        description: 页码
        required: true
      - name: pageSize
        type: int
        description: 每页大小
        required: true
      - name: id
        type: int
        required: true
      - name: applyNo
        type: string
        description: 申请单号
        required: true
      - name: supplierName
        type: string
        description: 供应商名称
        required: true
      - name: supplierCode
        type: string
        description: 供应商代码
        required: true
      - name: status
        type: int
        description: 状态
        multiple: true
        required: true
      - name: createByName
        type: string
        description: 创建人
        required: true
      - name: createAtStart
        type: string
        description: 创建时间开始
        required: true
      - name: createAtEnd
        type: string
        description: 创建时间结束
        required: true
      - name: applyUserName
        type: string
        description: 申请人
        required: true
      - name: applyTimeStart
        type: string
        description: 申请时间开始
        required: true
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
        required: true
      - name: applicationType
        type: int
        description: 供应商引入类型 1-供应商引入 2-存量供应商推荐
        required: true
      - name: brandName
        type: string
        description: 品牌名称
        required: true
      - name: brandId
        type: int
        description: 品牌id
        required: true
      - name: catIds
        type: int
        description: 主营一级产线
        multiple: true
        required: true
      - name: originType
        type: int
        description: 数据来源，1-CRM，2-PDM
        required: true
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
        required: true
      - name: firstDeptId
        type: int
        description: 一级部门id
        required: true
      - name: secondDeptId
        type: int
        description: 二级部门id
        required: true
      - name: thirdDeptId
        type: int
        description: 三级部门id
        required: true
      - name: fourthDeptId
        type: int
        description: 四级部门id
        required: true
      - name: userNoList
        type: string
        description: 筛选组织架构下的员工
        multiple: true
        required: true
    request_body:
      body:
        id: '{{ body_id }}'
        applyNo: '{{ body_applyNo }}'
        supplierName: '{{ body_supplierName }}'
        supplierCode: '{{ body_supplierCode }}'
        status: '{{ body_status }}'
        createByName: '{{ body_createByName }}'
        createAtStart: '{{ body_createAtStart }}'
        createAtEnd: '{{ body_createAtEnd }}'
        applyUserName: '{{ body_applyUserName }}'
        applyTimeStart: '{{ body_applyTimeStart }}'
        applyTimeEnd: '{{ body_applyTimeEnd }}'
        applicationType: '{{ body_applicationType }}'
        brandName: '{{ body_brandName }}'
        brandId: '{{ body_brandId }}'
        catIds: '{{ body_catIds }}'
        originType: '{{ body_originType }}'
        isApplicantLeader: '{{ body_isApplicantLeader }}'
        firstDeptId: '{{ body_firstDeptId }}'
        secondDeptId: '{{ body_secondDeptId }}'
        thirdDeptId: '{{ body_thirdDeptId }}'
        fourthDeptId: '{{ body_fourthDeptId }}'
        userNoList: '{{ body_userNoList }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
