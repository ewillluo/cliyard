description: 品类整合管理
methods:
  list:
    description: 分页查询品类整合信息
    http:
      method: POST
      path: /supplier-customer-import/page-list-category
    params:
      body:
      - name: pageIndex
        type: int
        description: 页码
        required: true
      - name: pageSize
        type: int
        description: 每页大小
        required: true
      - name: id
        type: int
        required: true
      - name: applyNo
        type: string
        description: 申请单号
        required: true
      - name: supplierName
        type: string
        description: 供应商名称
        required: true
      - name: supplierCode
        type: string
        description: 供应商代码
        required: true
      - name: status
        type: int
        description: 状态
        multiple: true
        required: true
      - name: createByName
        type: string
        description: 创建人
        required: true
      - name: createAtStart
        type: string
        description: 创建时间开始
        required: true
      - name: createAtEnd
        type: string
        description: 创建时间结束
        required: true
      - name: applyUserName
        type: string
        description: 申请人
        required: true
      - name: applyTimeStart
        type: string
        description: 申请时间开始
        required: true
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
        required: true
      - name: applicationType
        type: int
        description: 供应商引入类型
        required: true
      - name: brandName
        type: string
        description: 品牌名称
        required: true
      - name: brandId
        type: int
        description: 品牌id
        required: true
      - name: catIds
        type: int
        description: 主营一级产线
        multiple: true
        required: true
      - name: originType
        type: int
        description: 数据来源
        required: true
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
        required: true
    request_body:
      body:
        id: '{{ body_id }}'
        applyNo: '{{ body_applyNo }}'
        supplierName: '{{ body_supplierName }}'
        supplierCode: '{{ body_supplierCode }}'
        status: '{{ body_status }}'
        createByName: '{{ body_createByName }}'
        createAtStart: '{{ body_createAtStart }}'
        createAtEnd: '{{ body_createAtEnd }}'
        applyUserName: '{{ body_applyUserName }}'
        applyTimeStart: '{{ body_applyTimeStart }}'
        applyTimeEnd: '{{ body_applyTimeEnd }}'
        applicationType: '{{ body_applicationType }}'
        brandName: '{{ body_brandName }}'
        brandId: '{{ body_brandId }}'
        catIds: '{{ body_catIds }}'
        originType: '{{ body_originType }}'
        isApplicantLeader: '{{ body_isApplicantLeader }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  export:
    description: 导出品类整合信息
    http:
      method: POST
      path: /supplier-customer-import/export-category
    params:
      body:
      - name: id
        type: int
      - name: applyNo
        type: string
        description: 申请单号
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商代码
      - name: status
        type: int
        description: 状态
        multiple: true
      - name: createByName
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 创建时间开始
      - name: createAtEnd
        type: string
        description: 创建时间结束
      - name: applyUserName
        type: string
        description: 申请人
      - name: applyTimeStart
        type: string
        description: 申请时间开始
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
      - name: applicationType
        type: int
        description: 供应商引入类型
      - name: brandName
        type: string
        description: 品牌名称
      - name: brandId
        type: int
        description: 品牌id
      - name: catIds
        type: int
        description: 主营一级产线
        multiple: true
      - name: originType
        type: int
        description: 数据来源
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
    request_body:
      applicationType: '{{ applicationType }}'
      applyNo: '{{ applyNo }}'
      applyTimeEnd: '{{ applyTimeEnd }}'
      applyTimeStart: '{{ applyTimeStart }}'
      applyUserName: '{{ applyUserName }}'
      brandId: '{{ brandId }}'
      brandName: '{{ brandName }}'
      catIds: '{{ catIds | default(''[]'') }}'
      createAtEnd: '{{ createAtEnd }}'
      createAtStart: '{{ createAtStart }}'
      createByName: '{{ createByName }}'
      id: '{{ id }}'
      isApplicantLeader: '{{ isApplicantLeader }}'
      originType: '{{ originType }}'
      status: '{{ status | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
      supplierName: '{{ supplierName }}'
  delete:
    description: 删除品类
    http:
      method: POST
      path: /supplier-customer-import/delete-category
    params:
      body:
      - name: id
        type: int
      - name: applyNo
        type: string
        description: 申请单号
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商代码
      - name: status
        type: int
        description: 状态
        multiple: true
      - name: createByName
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 创建时间开始
      - name: createAtEnd
        type: string
        description: 创建时间结束
      - name: applyUserName
        type: string
        description: 申请人
      - name: applyTimeStart
        type: string
        description: 申请时间开始
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
      - name: applicationType
        type: int
        description: 供应商引入类型
      - name: brandName
        type: string
        description: 品牌名称
      - name: brandId
        type: int
        description: 品牌id
      - name: catIds
        type: int
        description: 主营一级产线
        multiple: true
      - name: originType
        type: int
        description: 数据来源
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
    request_body:
      applicationType: '{{ applicationType }}'
      applyNo: '{{ applyNo }}'
      applyTimeEnd: '{{ applyTimeEnd }}'
      applyTimeStart: '{{ applyTimeStart }}'
      applyUserName: '{{ applyUserName }}'
      brandId: '{{ brandId }}'
      brandName: '{{ brandName }}'
      catIds: '{{ catIds | default(''[]'') }}'
      createAtEnd: '{{ createAtEnd }}'
      createAtStart: '{{ createAtStart }}'
      createByName: '{{ createByName }}'
      id: '{{ id }}'
      isApplicantLeader: '{{ isApplicantLeader }}'
      originType: '{{ originType }}'
      status: '{{ status | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
      supplierName: '{{ supplierName }}'
  list-number:
    description: 获取品类筛选数据
    http:
      method: POST
      path: /supplier-customer-import/list-category-number
    params:
      body:
      - name: id
        type: int
      - name: applyNo
        type: string
        description: 申请单号
      - name: supplierName
        type: string
        description: 供应商名称
      - name: supplierCode
        type: string
        description: 供应商代码
      - name: status
        type: int
        description: 状态
        multiple: true
      - name: createByName
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 创建时间开始
      - name: createAtEnd
        type: string
        description: 创建时间结束
      - name: applyUserName
        type: string
        description: 申请人
      - name: applyTimeStart
        type: string
        description: 申请时间开始
      - name: applyTimeEnd
        type: string
        description: 申请时间结束
      - name: applicationType
        type: int
        description: 供应商引入类型
      - name: brandName
        type: string
        description: 品牌名称
      - name: brandId
        type: int
        description: 品牌id
      - name: catIds
        type: int
        description: 主营一级产线
        multiple: true
      - name: originType
        type: int
        description: 数据来源
      - name: isApplicantLeader
        type: bool
        description: 当前用户是否申请人的领导
    request_body:
      applicationType: '{{ applicationType }}'
      applyNo: '{{ applyNo }}'
      applyTimeEnd: '{{ applyTimeEnd }}'
      applyTimeStart: '{{ applyTimeStart }}'
      applyUserName: '{{ applyUserName }}'
      brandId: '{{ brandId }}'
      brandName: '{{ brandName }}'
      catIds: '{{ catIds | default(''[]'') }}'
      createAtEnd: '{{ createAtEnd }}'
      createAtStart: '{{ createAtStart }}'
      createByName: '{{ createByName }}'
      id: '{{ id }}'
      isApplicantLeader: '{{ isApplicantLeader }}'
      originType: '{{ originType }}'
      status: '{{ status | default(''[]'') }}'
      supplierCode: '{{ supplierCode }}'
      supplierName: '{{ supplierName }}'
