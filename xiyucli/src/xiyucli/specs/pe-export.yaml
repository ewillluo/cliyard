description: PE导出管理
methods:
  send-message:
    description: 导出品牌垂直信息异步发送消息
    http:
      method: POST
      path: /supplier-customer-import/export-send-message
    params:
      body:
      - name: code
        type: int
      - name: message
        type: string
      - name: taskId
        type: string
      - name: url
        type: string
      - name: taskStatus
        type: int
      - name: fullUrl
        type: string
        description: 下载地址
      - name: appName
        type: string
      - name: createBy
        type: string
        description: 创建人
      - name: taskInfo_url
        type: string
      - name: type
        type: string
      - name: templateUrl
        type: string
      - name: dataTotal
        type: int
      - name: pageSize
        type: int
      - name: noticeUrl
        type: string
      - name: concurrency
        type: int
      - name: customFileName
        type: string
      - name: noDataContinueFlag
        type: int
    request_body:
      data:
        taskId: '{{ data_taskId }}'
        url: '{{ data_url }}'
        taskStatus: '{{ data_taskStatus }}'
        fullUrl: '{{ data_fullUrl }}'
      taskInfo:
        appName: '{{ taskInfo_appName }}'
        createBy: '{{ taskInfo_createBy }}'
        url: '{{ taskInfo_url }}'
        type: '{{ taskInfo_type }}'
        templateUrl: '{{ taskInfo_templateUrl }}'
        dataTotal: '{{ taskInfo_dataTotal }}'
        pageSize: '{{ taskInfo_pageSize }}'
        noticeUrl: '{{ taskInfo_noticeUrl }}'
        concurrency: '{{ taskInfo_concurrency }}'
        customFileName: '{{ taskInfo_customFileName }}'
        noDataContinueFlag: '{{ taskInfo_noDataContinueFlag }}'
      code: '{{ code }}'
      message: '{{ message }}'
  add-pe:
    description: 新增品牌品类导出信息-PE
