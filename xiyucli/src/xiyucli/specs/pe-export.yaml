        multiple: true
      - name: id
        type: string
        description: id
      - name: applyNo
        type: string
        description: applyNo
      - name: supplierName
        type: string
        description: supplierName
      - name: supplierCode
        type: string
        description: supplierCode
      - name: status
        type: string
        description: status
      - name: createByName
        type: string
        description: createByName
      - name: createAtStart
        type: string
        description: createAtStart
      - name: createAtEnd
        type: string
        description: createAtEnd
      - name: applyUserName
        type: string
        description: applyUserName
      - name: applyTimeStart
        type: string
        description: applyTimeStart
      - name: applyTimeEnd
        type: string
        description: applyTimeEnd
      - name: applicationType
        type: string
        description: applicationType
      - name: brandName
        type: string
        description: brandName
      - name: brandId
        type: string
        description: brandId
      - name: catIds
        type: string
        description: catIds
      - name: originType
        type: string
        description: originType
      - name: isApplicantLeader
        type: string
        description: isApplicantLeader
      - name: firstDeptId
        type: string
        description: firstDeptId
      - name: secondDeptId
        type: string
        description: secondDeptId
      - name: thirdDeptId
        type: string
        description: thirdDeptId
      - name: fourthDeptId
