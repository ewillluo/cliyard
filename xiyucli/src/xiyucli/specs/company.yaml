description: 公司管理
methods:
  list-by-name:
    description: 根据公司名称模糊查询公司
    http:
      method: POST
      path: /crm/admin/v1/company/company-list-info-by-company-id-and-company-name
    params:
      body:
      - name: leaderCodes
        type: string
        required: true
    request_body:
      leaderCodes: '{{ leaderCodes }}'
  list-group-by-name:
    description: 根据公司名称获取集团公司
    http:
      method: POST
      path: /crm/admin/v1/company/get-group-company-list-by-company-name
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
      - name: selectType
        type: int
        description: 1-客户负责的公司
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
      selectType: '{{ selectType }}'
  list-client:
    description: 获取询价公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/client-company-list
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
      - name: selectType
        type: int
        description: 1-客户负责的公司
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
      selectType: '{{ selectType }}'
  list-tree-by-id:
    description: 根据公司ID查询公司树
    http:
      method: POST
      path: /crm/admin/v1/company/query-company-tree-info-by-company-id
    params:
      body:
      - name: groupCompanyId
        type: int
        required: true
      - name: pageIndex
        type: int
        required: true
      - name: pageSize
        type: int
        required: true
    request_body:
      groupCompanyId: '{{ groupCompanyId }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-docking-group-by-name:
    description: 获取对接或集团公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/get-docking-or-group-company-list-by-company-name
    params:
      body:
      - name: actualOrderingCompanyId
        type: int
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: groupCompanyId
        type: int
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
    request_body:
      actualOrderingCompanyId: '{{ actualOrderingCompanyId }}'
      companyNameLike: '{{ companyNameLike }}'
      groupCompanyId: '{{ groupCompanyId }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-docking:
    description: 获取对接公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/docking-company-list
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: demandType
        type: int
        description: 待办类型 1：上架 2：下架 在架
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      demandType: '{{ demandType }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-tree-by-id-v2:
    description: 根据公司ID获取公司树v2
    http:
      method: POST
      path: /crm/admin/v1/company/query-company-tree-info-by-company-id
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: groupCompanyId
        type: int
        description: 公司名称模糊查询
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      groupCompanyId: '{{ groupCompanyId }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-docking-by-name:
    description: 获取对接公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/get-docking-company-list-by-company-name
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: demandType
        type: int
        description: 待办类型 1：上架 2：下架 在架
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      demandType: '{{ demandType }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-docking-plural:
    description: 获取对接公司列表(一对多)
    http:
      method: POST
      path: /crm/admin/v1/company/docking-company-list-plural
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: demandType
        type: int
        description: 待办类型 1：上架 2：下架 在架
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      demandType: '{{ demandType }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-client-by-name:
    description: 获取询价公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/get-client-company-list-by-company-name
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
      - name: selectType
        type: int
        description: 1-客户负责的公司
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
      selectType: '{{ selectType }}'
  list-tree-by-id-name:
    description: 根据公司ID和名称获取集团信息
    http:
      method: POST
      path: /crm/admin/v1/company/get-company-tree-info-by-company-id-and-company-name
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
      - name: selectType
        type: int
        description: 1-客户负责的公司
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
      selectType: '{{ selectType }}'
  detail-by-docking-id:
    description: 根据对接ID获取对接公司信息
    http:
      method: POST
      path: /crm/admin/v1/company/get-docking-by-docking-id
    params:
      body:
      - name: dockingId
        type: int
        description: 公司ID
    request_body:
      dockingId: '{{ dockingId }}'
  list-docking-by-cid:
    description: 获取对接公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/get-docking-company-list-by-cid
    params:
      body:
      - name: companyId
        type: int
        description: 公司ID
      - name: companyName
        type: string
        description: 公司名称
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
    request_body:
      companyId: '{{ companyId }}'
      companyName: '{{ companyName }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  list-group:
    description: 获取集团公司列表
    http:
      method: POST
      path: /crm/admin/v1/company/group-company-list
    params:
      body:
      - name: companyNameLike
        type: string
        description: 公司名称模糊查询
      - name: pageIndex
        type: int
        description: 页码
      - name: pageSize
        type: int
        description: 每页大小
      - name: selectType
        type: int
        description: 1-客户负责的公司
    request_body:
      companyNameLike: '{{ companyNameLike }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
      selectType: '{{ selectType }}'
  create:
    description: 创建公司信息
    http:
      method: POST
      path: /crm//admin/v1/company-info/add
    params:
      body:
      - name: companyId
        type: string
      - name: companyName
        type: string
      - name: companyStatus
        type: string
      - name: createAt
        type: string
      - name: createBy
        type: string
      - name: updateBy
        type: string
        description: CreateByName
    request_body:
      companyId: '{{ companyId }}'
      companyName: '{{ companyName }}'
      companyStatus: '{{ companyStatus }}'
      createAt: '{{ createAt }}'
      createBy: '{{ createBy }}'
      updateBy: '{{ updateBy }}'
  delete:
    description: 删除公司信息
    http:
      method: POST
      path: /crm//admin/v1/company-info/delete
    params:
      body:
      - name: ids
        type: int
        multiple: true
    request_body:
      ids: '{{ ids | default(''[]'') }}'
  update:
    description: 修改公司信息
    http:
      method: POST
      path: /crm//admin/v1/company-info/update
    params:
      body:
      - name: companyId
        type: string
      - name: companyName
        type: string
      - name: companyStatus
        type: string
      - name: createBy
        type: string
      - name: id
        type: int
      - name: updateBy
        type: string
        description: CreateByName
      path:
      - name: id
        type: int
        description: id
        required: true
    request_body:
      companyId: '{{ companyId }}'
      companyName: '{{ companyName }}'
      companyStatus: '{{ companyStatus }}'
      createBy: '{{ createBy }}'
      id: '{{ id }}'
      updateBy: '{{ updateBy }}'
