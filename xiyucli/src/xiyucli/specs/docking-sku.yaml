description: 在架商品管理
methods:
  get-permission:
    description: 权限检测(按钮可见性)
    http:
      method: GET
      path: /docking-sku-status-list/get-button-permission
    params:
      body: []
      query:
      - name: dockingCompanyId
        type: int
        required: true
  batch-update:
    description: 批量更新在架SKU
    http:
      method: POST
      path: /docking-sku-status-list/batch-update
    params:
      body:
      - name: dockingCompanyId
        type: int
        description: 对接公司ID
      - name: dockingCompanyName
        type: string
        description: 对接公司名称
      - name: dockingId
        type: int
        description: 对接ID
    request_body:
      excelFile: '{{ excelFile | default(''[]'') }}'
      params:
        dockingCompanyId: '{{ dockingCompanyId }}'
        dockingCompanyName: '{{ dockingCompanyName }}'
        dockingId: '{{ dockingId }}'
  list-record:
    description: 查询批量更新记录
    http:
      method: POST
      path: /docking-sku-status-list/get-batch-update-record
    params:
      body:
      - name: pageIndex
        type: int
        description: 页码
        required: true
      - name: pageSize
        type: int
        description: 每页大小
        required: true
      - name: dockingCompanyId
        type: int
        description: 对接公司ID
        required: true
      - name: createBy
        type: string
        description: 创建人
        required: true
      - name: createAtStart
        type: string
        description: 操作时间开始
        required: true
      - name: createAtEnd
        type: string
        description: 操作时间结束
        required: true
      - name: taskStatus
        type: int
        description: 任务状态
        multiple: true
        required: true
    request_body:
      body:
        dockingCompanyId: '{{ dockingCompanyId }}'
        createBy: '{{ createBy }}'
        createAtStart: '{{ createAtStart }}'
        createAtEnd: '{{ createAtEnd }}'
        taskStatus: '{{ taskStatus }}'
      pageIndex: '{{ pageIndex }}'
      pageSize: '{{ pageSize }}'
  export-record:
    description: 导出更新记录详情
    http:
      method: POST
      path: /docking-sku-status-list/export-update-record
    params:
      body:
      - name: dockingCompanyId
        type: int
        description: 对接公司ID
      - name: createBy
        type: string
        description: 创建人
      - name: createAtStart
        type: string
        description: 操作时间开始
      - name: createAtEnd
        type: string
        description: 操作时间结束
      - name: taskStatus
        type: string
        description: 任务状态
    request_body:
      createAtEnd: '{{ createAtEnd }}'
      createAtStart: '{{ createAtStart }}'
      createBy: '{{ createBy }}'
      dockingCompanyId: '{{ dockingCompanyId }}'
      taskStatus: '{{ taskStatus }}'
